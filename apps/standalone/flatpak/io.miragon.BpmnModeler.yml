id: io.miragon.BpmnModeler
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: miragon-bpmn-modeler

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
  - --env=ELECTRON_TRASH=gio
  - --env=ELECTRON_OZONE_PLATFORM_HINT=x11
  - --unset-env=WAYLAND_DISPLAY
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: miragon-bpmn-modeler
    buildsystem: simple
    build-commands:
      - install -d /app/opt/miragon-bpmn-modeler
      - cp -a linux-unpacked/. /app/opt/miragon-bpmn-modeler/
      - install -Dm755 miragon-bpmn-modeler /app/bin/miragon-bpmn-modeler
      - install -Dm644 io.miragon.BpmnModeler.desktop /app/share/applications/io.miragon.BpmnModeler.desktop
      - install -Dm644 io.miragon.BpmnModeler.metainfo.xml /app/share/metainfo/io.miragon.BpmnModeler.metainfo.xml
      - install -Dm644 io.miragon.BpmnModeler.mime.xml /app/share/mime/packages/io.miragon.BpmnModeler.mime.xml
      - install -Dm644 io.miragon.BpmnModeler.png /app/share/icons/hicolor/512x512/apps/io.miragon.BpmnModeler.png
      - patch-electron-desktop-filename /app/opt/miragon-bpmn-modeler/resources/app.asar
    sources:
      - type: dir
        path: ../dist/linux-unpacked
        dest: linux-unpacked
      - type: script
        dest-filename: miragon-bpmn-modeler
        commands:
          - zypak-wrapper /app/opt/miragon-bpmn-modeler/miragon-bpmn-modeler --ozone-platform=x11 "$@"
      - type: file
        path: io.miragon.BpmnModeler.desktop
      - type: file
        path: io.miragon.BpmnModeler.metainfo.xml
      - type: file
        path: io.miragon.BpmnModeler.mime.xml
      - type: file
        path: io.miragon.BpmnModeler.png

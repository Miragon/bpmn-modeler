<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Element Template Editor</title>
    </head>
    <body>
        <div id="app"></div>
        <!-- Dev-only: `?theme=dark` stands in for the host's dark body class. -->
        <script>
            if (new URLSearchParams(location.search).get("theme") === "dark") {
                document.body.classList.add("vscode-dark");
            }
        </script>
        <script src="/src/templateEditor/main.ts" type="module"></script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Miragon Modeler — Readonly Viewer Demo</title>
        <style>
            body {
                margin: 0;
            }
            /* A readonly canvas beside a readonly properties panel — no palette,
               no editing. #app is sized by the shared demo header (viewport minus
               header + footer). */
            .viewer {
                position: relative;
                display: flex;
                height: 100%;
            }
            .viewer .canvas {
                position: relative;
                flex: 1;
                min-width: 0;
            }
            .viewer .properties {
                width: 320px;
                flex: none;
                border-left: 1px solid #d7d9de;
                overflow: auto;
                background: #fff;
            }
            :root[data-bpmn-theme="dark"] .viewer .properties {
                border-left-color: #3a3a3a;
                background: #1d1d1d;
            }
            .viewer .toolbar {
                position: absolute;
                top: 12px;
                /* clear the 320px properties panel */
                right: 332px;
                z-index: 10;
                display: flex;
                gap: 10px;
                align-items: center;
                padding: 8px 12px;
                background: rgba(255, 255, 255, 0.9);
                border: 1px solid #d7d9de;
                border-radius: 6px;
                font: 500 12px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            }
            .viewer .selection {
                min-width: 120px;
                color: #6b7280;
            }
            /* Theme is driven by the shared demo header now; the toolbar carries
               only the selection readout, so dark mode just needs a legible chrome. */
            :root[data-bpmn-theme="dark"] .viewer .toolbar {
                background: rgba(29, 29, 29, 0.9);
                border-color: #3a3a3a;
            }
            :root[data-bpmn-theme="dark"] .viewer .selection {
                color: #9aa0aa;
            }
        </style>
    </head>
    <body>
        <div id="app" style="height: 100vh">
            <div class="viewer">
                <div class="canvas" id="canvas"></div>
                <div class="properties" id="properties"></div>
                <div class="toolbar">
                    <span class="selection" id="selection">Nothing selected</span>
                </div>
            </div>
        </div>
        <script src="/viewer.ts" type="module"></script>
    </body>
</html>

# Save dependencies pinned to the exact published version
defaultSemverRangePrefix: ""

approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

# The @miragon/bpmn-iq-daemon-client package is published to private GitHub Packages.
# Fetching it needs GITHUB_TOKEN with read:packages on the Miragon org. The `:-`
# fallback keeps Yarn from hard-failing every invocation (even `yarn --version`)
# when the var is absent — jobs that don't install that package then work without
# a token; jobs that do still need a valid one.
npmScopes:
  miragon:
    npmRegistryServer: "https://npm.pkg.github.com"
    npmAlwaysAuth: true
    npmAuthToken: "${GITHUB_TOKEN:-}"

name: Bug Report
description: Report a bug to help us improve
type: "Bug"
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open a BPMN file
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false

  - type: dropdown
    id: host
    attributes:
      label: Host
      description: Where you are running the modeler.
      options:
        - VS Code extension
        - IntelliJ / JetBrains plugin
        - Standalone app
    validations:
      required: true

  - type: input
    id: modeler-version
    attributes:
      label: Modeler Version
      description: The extension, plugin, or standalone app version.
      placeholder: e.g. 0.8.3
    validations:
      required: true

  - type: input
    id: host-version
    attributes:
      label: Host Version
      description: Version of VS Code or the JetBrains IDE. Leave blank for the standalone app.
      placeholder: e.g. 1.96.0
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Camunda Engine
      options:
        - Camunda 7
        - Camunda 8
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
    validations:
      required: false

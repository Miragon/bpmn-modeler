name: Feature Request
description: Suggest a new feature or improvement for the BPMN/DMN modeler
type: "Feature"
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature!

        We review the **problem** before any solution. This issue will be
        triaged and only becomes a green light to implement once a maintainer
        marks it `accepted` — please don't open a PR before then. See
        [The Acceptance Gate](https://github.com/Miragon/bpmn-modeler/blob/main/CONTRIBUTING.md#the-acceptance-gate-triage).

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem are you trying to solve, and why does it matter? Describe the use case, not the solution.
      placeholder: When I ... I can't ... because ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: If you have one, how might this be solved? Optional — we discuss the problem first.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or mockups about the feature request.
    validations:
      required: false

  - type: checkboxes
    id: accountability
    attributes:
      label: Accountability
      options:
        - label: I have read this request and stand behind it. If I used an AI assistant to draft it, I have verified the content myself.
          required: true

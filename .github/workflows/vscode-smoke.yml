name: VS Code smoke

# The packaged extension in a real VS Code, driven through its webviews
# (apps/vscode-plugin/test/smoke, `test:vscode`): one suite per feature, each
# in its own VS Code window. A workflow of its own and not a required check,
# so it neither delays nor blocks the Build workflow. Pull requests run the
# suites their changed files select (.github/vscode-smoke-suites.json); main,
# the weekly run and a manual run without a suite list run every suite. The
# weekly run catches a new VS Code release breaking the extension without a
# change here.
on:
  pull_request:
    paths:
      - 'apps/vscode-plugin/**'
      - 'apps/bpmn-webview/**'
      - 'apps/dmn-webview/**'
      - 'apps/form-webview/**'
      - 'apps/deployment-webview/**'
      - 'apps/add-ons-webview/**'
      - 'libs/**'
      - '!libs/standalone-extension/**'
      - 'packages/bpmn-modeler/**'
      - 'packages/dmn-modeler/**'
      - 'resources/allowance-playground/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - 'tsconfig.base.json'
      - 'vite.shared.ts'
      - '.github/workflows/vscode-smoke.yml'
      - '.github/vscode-smoke-suites.json'
      - '.github/scripts/vscode-smoke-plan.mjs'
      - '.github/scripts/glob.mjs'
  # Main's own run: a test that landed meets the smoke here, not in the next pull request.
  push:
    branches: [ main ]
    # The pull request's paths; a repo check holds the two lists equal.
    paths:
      - 'apps/vscode-plugin/**'
      - 'apps/bpmn-webview/**'
      - 'apps/dmn-webview/**'
      - 'apps/form-webview/**'
      - 'apps/deployment-webview/**'
      - 'apps/add-ons-webview/**'
      - 'libs/**'
      - '!libs/standalone-extension/**'
      - 'packages/bpmn-modeler/**'
      - 'packages/dmn-modeler/**'
      - 'resources/allowance-playground/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - 'tsconfig.base.json'
      - 'vite.shared.ts'
      - '.github/workflows/vscode-smoke.yml'
      - '.github/vscode-smoke-suites.json'
      - '.github/scripts/vscode-smoke-plan.mjs'
      - '.github/scripts/glob.mjs'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      vscode-version:
        description: 'VS Code version, at least 1.78 (older Electron is too old for Playwright); empty for the newest stable'
        required: false
        default: ''
      suites:
        description: 'Suites to run, separated by spaces (see .github/vscode-smoke-suites.json); empty for all'
        required: false
        default: ''

permissions: {}

concurrency:
  group: vscode-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Lists the pull request's changed files.
      pull-requests: read
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        name: Choose the suites and spread them over jobs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REQUESTED_SUITES: ${{ inputs.suites }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed-files.txt"
            plan=$(node .github/scripts/vscode-smoke-plan.mjs --changed-files "$RUNNER_TEMP/changed-files.txt")
          elif [ -n "$REQUESTED_SUITES" ]; then
            plan=$(node .github/scripts/vscode-smoke-plan.mjs --suites "$REQUESTED_SUITES")
          else
            plan=$(node .github/scripts/vscode-smoke-plan.mjs --all)
          fi
          echo "jobs=$(jq -c '.jobs' <<< "$plan")" >> "$GITHUB_OUTPUT"
          {
            echo "### VS Code smoke suites"
            echo
            jq -r 'if (.suites | length) == 0 then "No suite covers the changed files."
                   else (.jobs[] | "- Job \(.id): \(.name)") end' <<< "$plan"
          } >> "$GITHUB_STEP_SUMMARY"

  suites:
    name: smoke (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Miragon/pin-npm-dependencies@3f7f02fa2454cdd2cdb65df19b081c0d77d301a5 # v1.2.2
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install xvfb and Linux build deps for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies
        run: corepack yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: corepack yarn build

      # The cache key needs the version before the test resolves it; the test then runs exactly it.
      - id: vscode
        name: Resolve the VS Code version and its cache folder
        env:
          REQUESTED: ${{ inputs.vscode-version }}
        run: |
          version="${REQUESTED:-$(curl -fsSL https://update.code.visualstudio.com/api/releases/stable | jq -r '.[0]')}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "cache=${XDG_CACHE_HOME:-$HOME/.cache}/bpmn-modeler-vscode-smoke" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vscode.outputs.cache }}
          key: vscode-smoke-${{ runner.os }}-${{ runner.arch }}-${{ steps.vscode.outputs.version }}

      # Not test:vscode:docker: the runner already is a throwaway Linux machine,
      # and the cache above keeps VS Code where a container volume would start empty.
      - name: Run the VS Code smoke suites
        run: xvfb-run -a corepack yarn workspace vs-code-bpmn-modeler test:vscode $SUITE_FILES
        env:
          SUITE_FILES: ${{ matrix.files }}
          VSCODE_SMOKE_VERSION: ${{ steps.vscode.outputs.version }}

      # Every suite's folder: screenshots always, and for a failed test its
      # screenshot, its focus report and VS Code's logs.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-smoke-results-${{ matrix.id }}
          path: test-results/vscode-smoke/
          if-no-files-found: ignore
          retention-days: 7

  # One result for the whole run, whatever jobs the plan made.
  vscode-smoke:
    needs: [ plan, suites ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          SUITES: ${{ needs.suites.result }}
        run: |
          echo "plan: $PLAN, suites: $SUITES"
          [ "$PLAN" = success ] && { [ "$SUITES" = success ] || [ "$SUITES" = skipped ]; }

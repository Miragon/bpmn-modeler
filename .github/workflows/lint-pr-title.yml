name: Lint PR Title

# Squash-merge makes the PR title the commit that lands on `main`, and
# release-please parses it for the version bump + changelog entry — so a
# malformed title silently yields no release. This gate fails loud at PR time.
#
# `edited` is required: fixing a bad title fires only `edited` (not
# `synchronize`), so the check would otherwise stay red until an unrelated push.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only feat and fix reach a release line (release-routing.mjs) and its
          # changelog, the two changelog-sections in release-please-config.json.
          # refactor, docs and chore reach no line; fold any other type into
          # `chore`.
          types: |
            feat
            fix
            refactor
            docs
            chore
          # Host attribution in the changelog is a cosmetic scope prefix, and one
          # webview scope can map to several hosts.
          requireScope: false

  # Checks the body's "Ships in" boxes against the title and the changed files
  # (release-check.mjs validate). Runs on every PR that starts workflows, the
  # release PR and Dependabot's included, so it can be required; `edited`
  # re-checks a body edit. Only the base branch's code runs, and it reads the
  # PR's title, body and files through the API, the same way the sync and the
  # Claude Code hook do.
  release-lines:
    name: Validate release lines
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          sparse-checkout: .github
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check the Ships in declaration
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # A base branch from before the check (an older stacked base) has nothing to run.
          if ! grep -q 'check --pr' .github/scripts/release-lines-sync.mjs 2>/dev/null; then
            echo "The base branch has no release-line check yet; nothing to validate."
            exit 0
          fi
          node .github/scripts/release-lines-sync.mjs check --pr "$PR_NUMBER" --repo "$REPO"

name: Lint PR Title

# Squash-merge makes the PR *title* the commit that lands on `main`, and
# release-please reads it to pick the version bump and changelog entry — so a
# malformed title silently yields no bump / no changelog line. This gate fails
# loud at PR time instead.
#
# `edited` is required: fixing a bad title fires only `edited` (not
# `synchronize`), so without it a failing check sticks until an unrelated push.
# That's also why this isn't folded into build.yml's `ci` rollup.
#
# Not exempting the release-please PR: it's opened with RELEASE_PAT, so this runs
# on it too (its `chore(main): release X.Y.Z` title passes).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The only types release-please acts on here: feat/fix bump the
          # version, and these five are the changelog-sections in
          # release-please-config.json. Any other type would pass lint but bump
          # nothing and never reach the changelog — fold those into `chore`.
          types: |
            feat
            fix
            refactor
            docs
            chore
          # Scope unconstrained: host attribution in the changelog is a cosmetic
          # prefix, and one webview scope can map to several hosts.
          requireScope: false

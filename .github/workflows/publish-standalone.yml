name: Publish Standalone

# Builds the VS Code extension once on Linux, then packages the desktop app on
# each target OS (macOS DMG, Windows NSIS .exe, Linux Flatpak). Native modules
# must be compiled against each platform's Node ABI, so every packaging job
# runs on its own runner — no cross-compilation.
#
# Callable two ways:
#   - workflow_dispatch (manual single-step run; dry-run defaults to true)
#   - workflow_call (from release-standalone.yml orchestrator)
#
# In workflow_call mode the workflow exposes the DMG's sha256 and filename
# so the homebrew job can skip re-downloading the ~150 MB DMG. The Windows
# artifact ships to the GitHub Release directly and feeds electron-updater
# (latest.yml) on next launch. Flatpak updates remain manual, so its bundle is
# attached only to the versioned GitHub Release.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (build + sign + notarize, do not publish)'
        required: false
        type: boolean
        default: true
      ref:
        description: 'Git ref to check out. Real publishes must resolve to the vscode-v<version> tag commit.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      dry-run:
        description: 'Dry run (build + sign + notarize, do not publish)'
        required: false
        type: boolean
        default: true
      ref:
        description: 'Git ref to check out (e.g. the vscode-v<version> release tag). Defaults to the triggering SHA.'
        required: false
        type: string
        default: ''
    outputs:
      dmg-sha256:
        description: 'sha256 of the signed/notarized DMG'
        value: ${{ jobs.package-dmg.outputs.dmg-sha256 }}
      dmg-filename:
        description: 'Base filename of the DMG (e.g. Miragon BPMN Modeler-0.0.4-arm64.dmg)'
        value: ${{ jobs.package-dmg.outputs.dmg-filename }}
    secrets:
      CSC_LINK:
        required: true
      CSC_KEY_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_APP_SPECIFIC_PASSWORD:
        required: true
      APPLE_TEAM_ID:
        required: true

permissions:
  contents: write
  deployments: write

concurrency:
  group: standalone-publish
  cancel-in-progress: false

jobs:
  build-vsix:
    name: Build VS Code extension (.vsix)
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify release source
        if: inputs.dry-run == false
        run: |
          VERSION=$(node -e "console.log(require('./apps/standalone/package.json').version)")
          TAG="vscode-v${VERSION}"
          if ! TAG_SHA=$(git rev-list -n 1 "$TAG" 2>/dev/null); then
            echo "Release tag $TAG does not exist." && exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "Checked-out commit $HEAD_SHA does not match $TAG ($TAG_SHA)." && exit 1
          fi

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (libs → webviews → vscode-plugin)
        run: yarn build

      - name: Package .vsix
        working-directory: dist/apps/vscode-plugin
        run: npx @vscode/vsce package --out bpmn-modeler-plugin.vsix --yarn --no-dependencies

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-vsix
          path: dist/apps/vscode-plugin/bpmn-modeler-plugin.vsix
          retention-days: 1
          if-no-files-found: error

  package-dmg:
    name: Sign, notarize, publish DMG (macOS)
    runs-on: macos-latest
    needs: build-vsix
    # Gate behind the standalone environment so CSC_*/APPLE_* signing secrets
    # are only readable after the environment's protection rules pass. Applies
    # to dry-runs too: signing + notarization run in dry-run mode, so the real
    # Apple certs are read regardless of dry-run.
    environment: standalone
    outputs:
      dmg-sha256: ${{ steps.dmg-meta.outputs.sha256 }}
      dmg-filename: ${{ steps.dmg-meta.outputs.filename }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-vsix.outputs.source-sha }}

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download .vsix from build-vsix job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: standalone-vsix
          path: dist/apps/vscode-plugin

      - name: Bundle extension into standalone plugins/
        run: yarn workspace @miragon/bpmn-modeler-standalone bundle

      - name: Build, sign, notarize DMG (dry-run)
        if: inputs.dry-run == true
        run: yarn workspace @miragon/bpmn-modeler-standalone run package:signed
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build, sign, notarize DMG (release)
        if: inputs.dry-run == false
        run: yarn workspace @miragon/bpmn-modeler-standalone run package:release
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Compute DMG metadata (sha256 + filename)
        id: dmg-meta
        run: |
          shopt -s nullglob
          DMG_FILES=(apps/standalone/dist/*.dmg)
          if [ "${#DMG_FILES[@]}" -eq 0 ]; then
            echo "No DMG produced in apps/standalone/dist/." && exit 1
          fi
          DMG_PATH="${DMG_FILES[0]}"
          DMG_NAME="$(basename "$DMG_PATH")"
          SHA="$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')"
          echo "filename=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "DMG: $DMG_NAME"
          echo "sha256: $SHA"

      - name: Upload DMG artifact (dry-run)
        if: inputs.dry-run == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-dmg-dry-run
          path: |
            apps/standalone/dist/*.dmg
            apps/standalone/dist/*.dmg.blockmap
            apps/standalone/dist/latest-mac.yml
          retention-days: 7

      - name: Upload artifacts to release
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -e "console.log(require('./apps/standalone/package.json').version)")
          TAG="vscode-v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist. Create it first (tag + 'gh release create $TAG')." && exit 1
          fi
          shopt -s nullglob
          FILES=(apps/standalone/dist/*.dmg apps/standalone/dist/*.dmg.blockmap apps/standalone/dist/latest-mac.yml)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No artifacts found in apps/standalone/dist/." && exit 1
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber

          # Mirror the same artifacts onto the rolling `standalone-latest`
          # prerelease — the fixed feed electron-updater reads (see
          # electron-builder.yml `publish`). Prerelease so it never becomes the
          # repo's /releases/latest; create-if-missing tolerates the race with
          # the other platform job (whichever loses the create just uploads).
          gh release create standalone-latest --prerelease \
            --title "Standalone auto-update feed" \
            --notes "Rolling feed for the desktop app's auto-updater. Assets are overwritten on each standalone release — install from the Download page, not from here." \
            2>/dev/null || true
          gh release upload standalone-latest "${FILES[@]}" --clobber

  package-windows:
    name: Package NSIS installer (Windows)
    runs-on: windows-2022
    needs: build-vsix
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-vsix.outputs.source-sha }}

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download .vsix from build-vsix job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: standalone-vsix
          path: dist/apps/vscode-plugin

      - name: Bundle extension into standalone plugins/
        run: yarn workspace @miragon/bpmn-modeler-standalone bundle

      - name: Build NSIS installer
        run: yarn workspace @miragon/bpmn-modeler-standalone run package
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload NSIS artifact (dry-run)
        if: inputs.dry-run == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-nsis-dry-run
          path: |
            apps/standalone/dist/*.exe
            apps/standalone/dist/*.exe.blockmap
            apps/standalone/dist/latest.yml
          retention-days: 7

      - name: Upload artifacts to release
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -e "console.log(require('./apps/standalone/package.json').version)")
          TAG="vscode-v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist. Create it first (tag + 'gh release create $TAG')." && exit 1
          fi
          shopt -s nullglob
          FILES=(apps/standalone/dist/*.exe apps/standalone/dist/*.exe.blockmap apps/standalone/dist/latest.yml)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No artifacts found in apps/standalone/dist/." && exit 1
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber

          # Mirror the same artifacts onto the rolling `standalone-latest`
          # prerelease — the fixed feed electron-updater reads (see
          # electron-builder.yml `publish`). Prerelease so it never becomes the
          # repo's /releases/latest; create-if-missing tolerates the race with
          # the other platform job (whichever loses the create just uploads).
          gh release create standalone-latest --prerelease \
            --title "Standalone auto-update feed" \
            --notes "Rolling feed for the desktop app's auto-updater. Assets are overwritten on each standalone release — install from the Download page, not from here." \
            2>/dev/null || true
          gh release upload standalone-latest "${FILES[@]}" --clobber

  package-flatpak:
    name: Package Flatpak bundle (Linux x86_64)
    runs-on: ubuntu-latest
    needs: build-vsix

    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.build-vsix.outputs.source-sha }}

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn

      - name: Install Linux build and Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder \
            build-essential python3 make g++ pkg-config \
            libx11-dev libxkbfile-dev libsecret-1-dev \
            desktop-file-utils appstream libxml2-utils
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install dependencies
        run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download .vsix from build-vsix job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: standalone-vsix
          path: dist/apps/vscode-plugin

      - name: Download Theia plugins
        run: yarn workspace @miragon/bpmn-modeler-standalone download:plugins

      - name: Bundle extension into standalone plugins/
        run: yarn workspace @miragon/bpmn-modeler-standalone bundle

      - name: Build Linux application directory
        run: yarn workspace @miragon/bpmn-modeler-standalone run package:linux:dir
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build Flatpak bundle
        run: yarn workspace @miragon/bpmn-modeler-standalone run package:flatpak:bundle

      - name: Upload Flatpak artifact (dry-run)
        if: inputs.dry-run == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-flatpak-dry-run
          path: apps/standalone/dist/*.flatpak
          retention-days: 7
          if-no-files-found: error

      - name: Upload Flatpak to release
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -e "console.log(require('./apps/standalone/package.json').version)")
          TAG="vscode-v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist. Create it first (tag + 'gh release create $TAG')." && exit 1
          fi
          shopt -s nullglob
          FILES=(apps/standalone/dist/*.flatpak)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No Flatpak bundle found in apps/standalone/dist/." && exit 1
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber

  record-deployment:
    name: Record deployment
    runs-on: ubuntu-latest
    needs: [build-vsix, package-dmg, package-windows, package-flatpak]
    if: inputs.dry-run == false
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-vsix.outputs.source-sha }}

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./apps/standalone/package.json').version)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Record deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const version = "${{ steps.version.outputs.version }}";
            const tag = `vscode-v${version}`;
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: tag,
              environment: "standalone",
              description: `Standalone app v${version}`,
              required_contexts: [],
              auto_merge: false,
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`,
              description: `Standalone app v${version} published`,
            });

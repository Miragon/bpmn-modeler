name: Release Standalone

# Manual publish orchestrator for the standalone app. The shared version and
# `vscode-v<version>` tag are produced by release-please (release-please.yml); this
# workflow only *publishes* against an existing release. It chains
# publish-standalone.yml (DMG + Windows installer + Flatpak) →
# publish-standalone-homebrew.yml.
# Each sub-workflow is also runnable on its own via workflow_dispatch for
# debugging or partial reruns. Dry-run propagates to both steps.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without prefix (e.g. 1.2.3). The release tag is vscode-v<version>.'
        required: true
        type: string
      dry-run:
        description: 'Dry run (no upload or tap push)'
        required: false
        type: boolean
        default: false
      skip-homebrew:
        description: 'Skip the Homebrew tap update'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: 'Version to publish, without prefix (e.g. 1.2.3). The release tag is vscode-v<version>.'
        required: true
        type: string
      dry-run:
        description: 'Dry run (no upload or tap push)'
        required: false
        type: boolean
        default: false
      skip-homebrew:
        description: 'Skip the Homebrew tap update'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  deployments: write

concurrency:
  group: standalone-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish installers
    uses: ./.github/workflows/publish-standalone.yml
    with:
      dry-run: ${{ inputs.dry-run }}
      # Real runs check out the release tag so the bundled version matches the
      # release; dry-runs build from the triggering SHA (no tag required).
      ref: ${{ inputs.dry-run && github.sha || format('vscode-v{0}', inputs.version) }}
    secrets: inherit

  homebrew:
    name: Update Homebrew tap
    needs: publish
    if: ${{ !inputs.skip-homebrew }}
    uses: ./.github/workflows/publish-standalone-homebrew.yml
    with:
      version: ${{ inputs.version }}
      dmg-sha256: ${{ needs.publish.outputs.dmg-sha256 }}
      dmg-filename: ${{ needs.publish.outputs.dmg-filename }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

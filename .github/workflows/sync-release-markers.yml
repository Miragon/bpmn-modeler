name: Sync release markers

# release-please routes each commit by its changed file paths, and only the root
# component can watch multiple paths. The root slot belongs to the publishable
# @miragon/bpmn-modeler package ("." minus exclude-paths — the package plus the
# 10 libs it inlines), because semver correctness matters most for the published
# library. The two hosts are single-path components that *bundle* sources living
# outside their own path — a coupling no manifest records. This workflow closes
# that gap by committing a per-host marker (always a `fix(...)`, i.e. a patch
# bump) whenever a bundled source lands on `main`, so the host line releases too:
#
#   - vscode    (apps/vscode-plugin): ships the four webviews, the standalone
#               app (versioned in lockstep), libs/modeler-core, libs/shared,
#               libs/standalone-extension and the npm-package sphere.
#   - intellij  (apps/intellij-plugin): ships the bpmn/deployment webviews,
#               apps/modeler-bridge, libs/modeler-core, libs/shared and the
#               npm-package sphere. DMN/form webviews are not bundled.
#
# Markers are decoupled from the underlying commit's severity: a `!` in a
# bundled source yields only a patch marker on hosts that merely bundle it. A
# host that a change genuinely breaks must touch that host's own path.
#
# At most ONE marker is committed per host per release cycle: once a marker is
# pending (changed since that host's last tag), further pushes skip for that
# host — the pending release PR already carries the bump. That keeps each
# changelog to a single "sync" line per release instead of one per push.
#
# Commits go through the GitHub App Contents API so the push is signed and
# re-triggers release-please.yml (a plain GITHUB_TOKEN push would not). Neither
# marker file lives under a trigger path below, so a marker push cannot
# re-trigger this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'apps/bpmn-webview/**'
      - 'apps/dmn-webview/**'
      - 'apps/form-webview/**'
      - 'apps/deployment-webview/**'
      - 'apps/modeler-bridge/**'
      - 'apps/standalone/**'
      - 'packages/bpmn-modeler/**'
      - 'libs/append-menu/**'
      - 'libs/bpmn-clipboard/**'
      - 'libs/bpmn-diff/**'
      - 'libs/bpmn-i18n-extras/**'
      - 'libs/code-link/**'
      - 'libs/element-template-chooser/**'
      - 'libs/flow-navigation/**'
      - 'libs/inline-scripting/**'
      - 'libs/model-navigation/**'
      - 'libs/modeler-core/**'
      - 'libs/modeler-types/**'
      - 'libs/shared/**'
      - 'libs/standalone-extension/**'
  workflow_dispatch: {}

permissions:
  contents: write

# Serialize runs so two shared-frontend pushes can't race on a marker file.
concurrency:
  group: sync-release-markers
  cancel-in-progress: false

jobs:
  sync:
    name: Record bundled sources per host line
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Sync per-host markers for bundled sources
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          SHORT_SHA="${SHA:0:7}"

          # The npm-package sphere: packages/bpmn-modeler plus the 10 libs it
          # inlines (vite.config.mts INLINED_LIBS). Bundled by both hosts.
          SPHERE='^packages/bpmn-modeler/|^libs/(append-menu|bpmn-clipboard|bpmn-diff|bpmn-i18n-extras|code-link|element-template-chooser|flow-navigation|inline-scripting|model-navigation|modeler-types)/'

          # Files changed in this push (empty on workflow_dispatch — no BEFORE).
          PUSH_FILES=""
          if [ "$EVENT_NAME" = "push" ] && [[ ! "$BEFORE" =~ ^0+$ ]]; then
            PUSH_FILES=$(gh api "repos/${REPO}/compare/${BEFORE}...${SHA}" --jq '.files[].filename' 2>/dev/null || true)
          fi

          # sync_marker <host> <marker-path> <tag-prefix> <relevant-regex> <native-regex> <commit-message-prefix>
          #   relevant-regex : paths whose change means this host must be marked
          #   native-regex   : the host's own path (skip; the push routes natively)
          sync_marker() {
            local NAME="$1" MARKER_PATH="$2" TAG_PREFIX="$3" RELEVANT="$4" NATIVE="$5" MSG_PREFIX="$6"

            # On push, require that the push actually touched a relevant path AND
            # did not touch the host's own path. On workflow_dispatch there is no
            # BEFORE — rely on the pending / same-sha guards below.
            if [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_FILES" ]; then
              if printf '%s\n' "$PUSH_FILES" | grep -qE "$NATIVE"; then
                echo "[$NAME] push touched the host's own path; routes natively, no marker."
                return 0
              fi
              if ! printf '%s\n' "$PUSH_FILES" | grep -qE "$RELEVANT"; then
                echo "[$NAME] push touched no bundled path; nothing to sync."
                return 0
              fi
            fi

            # One marker per release cycle: skip if one is pending since the last tag.
            local LATEST_TAG
            LATEST_TAG=$(gh api "repos/${REPO}/releases?per_page=100" \
              --jq "map(select(.tag_name | startswith(\"${TAG_PREFIX}\"))) | .[0].tag_name" 2>/dev/null || true)
            if [ -n "${LATEST_TAG:-}" ] && [ "$LATEST_TAG" != "null" ]; then
              if gh api "repos/${REPO}/compare/${LATEST_TAG}...main" --jq '.files[].filename' 2>/dev/null \
                  | grep -q "^${MARKER_PATH}\$"; then
                echo "[$NAME] sync already pending since ${LATEST_TAG}; nothing to sync."
                return 0
              fi
            fi

            local CONTENT CONTENT_B64
            CONTENT=$(printf '# Generated by sync-release-markers.yml — do not edit by hand.\n# The bundled-sources commit synced into the %s release line.\nbundledCommit=%s\n' "$NAME" "$SHA")
            CONTENT_B64=$(printf '%s' "$CONTENT" | base64 -w0)

            # The Contents API needs the current blob sha to update; absent on first run.
            local EXISTING_SHA
            EXISTING_SHA=$(gh api "repos/${REPO}/contents/${MARKER_PATH}?ref=main" --jq .sha 2>/dev/null || true)

            if [ -n "$EXISTING_SHA" ]; then
              local CURRENT
              CURRENT=$(gh api "repos/${REPO}/contents/${MARKER_PATH}?ref=main" --jq .content 2>/dev/null | tr -d '\n' | base64 -d || true)
              if printf '%s' "$CURRENT" | grep -q "bundledCommit=${SHA}\$"; then
                echo "[$NAME] marker already at ${SHORT_SHA}; nothing to commit."
                return 0
              fi
            fi

            local MSG="${MSG_PREFIX} (${SHORT_SHA})"
            if [ -n "$EXISTING_SHA" ]; then
              gh api -X PUT "repos/${REPO}/contents/${MARKER_PATH}" \
                -f message="$MSG" -f content="$CONTENT_B64" -f branch=main -f sha="$EXISTING_SHA" >/dev/null
            else
              gh api -X PUT "repos/${REPO}/contents/${MARKER_PATH}" \
                -f message="$MSG" -f content="$CONTENT_B64" -f branch=main >/dev/null
            fi
            echo "[$NAME] recorded bundled commit ${SHORT_SHA}."
          }

          # vscode: bundles the four webviews, standalone (lockstep version),
          # host libs and the npm-package sphere.
          sync_marker \
            "vscode" \
            "apps/vscode-plugin/BUNDLED_WEBVIEW" \
            "vscode-v" \
            "^apps/(bpmn-webview|dmn-webview|form-webview|deployment-webview|standalone)/|^libs/(modeler-core|shared|standalone-extension)/|${SPHERE}" \
            "^apps/vscode-plugin/" \
            "fix(vscode): sync bundled sources"

          # intellij: bundles the bpmn/deployment webviews, the bridge, host
          # libs and the npm-package sphere. DMN/form webviews are not bundled.
          sync_marker \
            "intellij" \
            "apps/intellij-plugin/BUNDLED_WEBVIEW" \
            "intellij-v" \
            "^apps/(bpmn-webview|deployment-webview|modeler-bridge)/|^libs/(modeler-core|shared)/|${SPHERE}" \
            "^apps/intellij-plugin/" \
            "fix(intellij): sync bundled webview"

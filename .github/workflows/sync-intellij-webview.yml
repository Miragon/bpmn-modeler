name: Sync IntelliJ on webview change

# The IntelliJ plugin bundles the frontend sources below at build time, but that
# coupling is in no manifest — so a shared-frontend fix bumps only the vscode
# line. This commits a `fix(intellij):` marker under apps/intellij-plugin/** so
# the IntelliJ line releases too. The paths list every bundled source (DMN,
# vscode-plugin, standalone and standalone-extension are excluded — not bundled).

on:
  push:
    branches: [main]
    paths:
      - 'apps/bpmn-webview/**'
      - 'apps/deployment-webview/**'
      - 'apps/modeler-bridge/**'
      - 'libs/append-menu/**'
      - 'libs/bpmn-clipboard/**'
      - 'libs/bpmn-i18n/**'
      - 'libs/code-link/**'
      - 'libs/element-template-chooser/**'
      - 'libs/model-navigation/**'
      - 'libs/modeler-core/**'
      - 'libs/shared/**'

permissions:
  contents: write

# Serialize runs so two shared-frontend pushes can't race on the marker file.
concurrency:
  group: sync-intellij-webview
  cancel-in-progress: false

jobs:
  sync:
    name: Record bundled webview for IntelliJ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Record bundled-webview commit for the IntelliJ release line
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # If this same push already changed the IntelliJ plugin, a human
          # already triggered a bump — skip the redundant marker commit.
          if [[ ! "$BEFORE" =~ ^0+$ ]]; then
            if gh api "repos/${REPO}/compare/${BEFORE}...${SHA}" --jq '.files[].filename' \
                | grep -q '^apps/intellij-plugin/'; then
              echo "Push already touched apps/intellij-plugin; nothing to sync."
              exit 0
            fi
          fi

          MARKER_PATH="apps/intellij-plugin/BUNDLED_WEBVIEW"
          SHORT_SHA="${SHA:0:7}"

          # The build never reads this file — only the commit under
          # apps/intellij-plugin/** matters for release routing. Its content is
          # a human-readable record of which shared-frontend commit each
          # IntelliJ release bundles.
          CONTENT=$(printf '# Generated by sync-intellij-webview.yml — do not edit by hand.\n# The shared-frontend commit bundled into the IntelliJ plugin.\nbundledWebviewCommit=%s\n' "$SHA")
          CONTENT_B64=$(printf '%s' "$CONTENT" | base64 -w0)

          # The Contents API needs the current blob sha to update an existing
          # file; it is absent on the first run (marker does not exist yet).
          EXISTING_SHA=$(gh api "repos/${REPO}/contents/${MARKER_PATH}?ref=main" --jq .sha 2>/dev/null || true)

          # No-op guard: if the marker already points at this commit, another
          # run beat us to it.
          if [ -n "$EXISTING_SHA" ]; then
            CURRENT=$(gh api "repos/${REPO}/contents/${MARKER_PATH}?ref=main" --jq .content 2>/dev/null | tr -d '\n' | base64 -d || true)
            if printf '%s' "$CURRENT" | grep -q "bundledWebviewCommit=${SHA}\$"; then
              echo "Marker already at ${SHORT_SHA}; nothing to commit."
              exit 0
            fi
          fi

          # Commit through the API so the GitHub App signs it (passes a
          # required_signatures ruleset) and — unlike GITHUB_TOKEN — the push
          # triggers release-please.yml.
          MSG="fix(intellij): sync bundled webview (${SHORT_SHA})"
          if [ -n "$EXISTING_SHA" ]; then
            gh api -X PUT "repos/${REPO}/contents/${MARKER_PATH}" \
              -f message="$MSG" -f content="$CONTENT_B64" -f branch=main -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api -X PUT "repos/${REPO}/contents/${MARKER_PATH}" \
              -f message="$MSG" -f content="$CONTENT_B64" -f branch=main >/dev/null
          fi
          echo "Recorded bundled webview ${SHORT_SHA} for the IntelliJ release line."

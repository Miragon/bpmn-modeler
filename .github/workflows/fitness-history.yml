name: Fitness history

# Stores one snapshot of every fitness function per first-parent main commit on
# the orphan data branch `fitness-history`, and backfills older commits from
# git. `corepack yarn fitness` reads the branch after a normal fetch, offline.
# Findings never fail this job; only broken input does.
#
# The branch is written through the Git Data API, so GitHub signs the commits,
# and the ref moves by fast-forward only: a run that lost a race fails loudly
# and the next push fills the gap.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Queued, not cancelled: a newer run measures its HEAD and backfills the commits
# a skipped run would have measured.
concurrency:
  group: fitness-history
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspaces
        with:
          focus: '@miragon/bpmn-modeler-repo-checks'
      - name: Fetch the stored snapshots
        run: git fetch --no-tags origin fitness-history:refs/remotes/origin/fitness-history || echo "No fitness-history branch yet."
      - name: Measure HEAD and backfill
        run: yarn fitness snapshot --out "$RUNNER_TEMP/fitness"
      - name: Commit the snapshots to fitness-history
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=("$RUNNER_TEMP"/fitness/snapshots/*.json)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "Every snapshot is up to date."
            exit 0
          fi

          TREE_ENTRIES=$(for FILE in "${FILES[@]}"; do
            jq -n --arg path "snapshots/$(basename "$FILE")" --rawfile content "$FILE" \
              '{path:$path, mode:"100644", type:"blob", content:$content}'
          done | jq -s -c .)
          MSG="chore: store ${#FILES[@]} fitness snapshot(s) at ${SHA:0:7}"

          if PARENT=$(gh api "repos/${REPO}/git/ref/heads/fitness-history" --jq .object.sha 2>/dev/null); then
            BASE_TREE=$(gh api "repos/${REPO}/git/commits/${PARENT}" --jq .tree.sha)
            TREE_SHA=$(jq -n --arg base "$BASE_TREE" --argjson entries "$TREE_ENTRIES" \
              '{base_tree:$base, tree:$entries}' \
              | gh api -X POST "repos/${REPO}/git/trees" --input - --jq .sha)
            COMMIT_SHA=$(jq -n --arg msg "$MSG" --arg tree "$TREE_SHA" --arg parent "$PARENT" \
              '{message:$msg, tree:$tree, parents:[$parent]}' \
              | gh api -X POST "repos/${REPO}/git/commits" --input - --jq .sha)
            gh api -X PATCH "repos/${REPO}/git/refs/heads/fitness-history" -f sha="$COMMIT_SHA" >/dev/null
          else
            TREE_SHA=$(jq -n --argjson entries "$TREE_ENTRIES" '{tree:$entries}' \
              | gh api -X POST "repos/${REPO}/git/trees" --input - --jq .sha)
            COMMIT_SHA=$(jq -n --arg msg "$MSG" --arg tree "$TREE_SHA" \
              '{message:$msg, tree:$tree, parents:[]}' \
              | gh api -X POST "repos/${REPO}/git/commits" --input - --jq .sha)
            gh api -X POST "repos/${REPO}/git/refs" -f ref=refs/heads/fitness-history -f sha="$COMMIT_SHA" >/dev/null
          fi
          echo "Stored ${#FILES[@]} snapshot(s) as ${COMMIT_SHA:0:7}."
      - name: Report HEAD against the stored snapshots
        run: |
          git fetch --no-tags origin fitness-history:refs/remotes/origin/fitness-history || true
          yarn fitness >> "$GITHUB_STEP_SUMMARY"

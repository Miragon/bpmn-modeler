name: Fitness history

# Stores one snapshot of every fitness function per first-parent main commit on
# the orphan data branch `fitness-history`, and backfills older commits from
# git. `corepack yarn fitness` reads the branch after a normal fetch, offline.
# Findings never fail this job; only broken input does.
#
# The branch is written through the Git Data API by the store-fitness-history
# action, so GitHub signs the commits and the ref moves by fast-forward only; a
# run that lost a race rebuilds its tree on the new head. The Mutation workflow
# stores its weekly scores on the same branch through the same action.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Queued, not cancelled: a newer run measures its HEAD and backfills the commits
# a skipped run would have measured.
concurrency:
  group: fitness-history
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspaces
        with:
          focus: '@miragon/bpmn-modeler-repo-checks'
      - name: Fetch the stored snapshots
        run: git fetch --no-tags origin fitness-history:refs/remotes/origin/fitness-history || echo "No fitness-history branch yet."
      - name: Measure HEAD and backfill
        run: yarn fitness snapshot --out "$RUNNER_TEMP/fitness"
      - name: Commit the snapshots to fitness-history
        uses: ./.github/actions/store-fitness-history
        with:
          out-dir: ${{ runner.temp }}/fitness
      - name: Report HEAD against the stored snapshots
        run: |
          git fetch --no-tags origin fitness-history:refs/remotes/origin/fitness-history || true
          yarn fitness >> "$GITHUB_STEP_SUMMARY"

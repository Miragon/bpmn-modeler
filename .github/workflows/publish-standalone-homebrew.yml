name: Publish Standalone (Homebrew)

# Updates the Cask formula in Miragon/homebrew-tap after a standalone release.
#
# Callable two ways:
#   - workflow_call (from release-standalone.yml orchestrator) — receives the
#     DMG sha256 and filename as inputs, so no re-download of the ~150 MB DMG.
#   - workflow_dispatch (manual rerun) — sha256 and filename are recomputed
#     by downloading the DMG from the release.
#
# Writes to the tap as the miragon-release-please GitHub App (org-level
# RELEASE_PLEASE_APP_CLIENT_ID / RELEASE_PLEASE_APP_PRIVATE_KEY). The tap's main
# is PR-only, squash-only and requires signed commits, so the job opens a PR and
# squash-merges it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without prefix (e.g. 1.2.3). Tag is always vscode-v<version>."
        required: true
        type: string
      dry-run:
        description: "Generate formula without pushing to tap"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Version without prefix (e.g. 0.0.4)"
        required: true
        type: string
      dmg-sha256:
        description: "sha256 of the DMG (skip recompute when provided)"
        required: false
        type: string
        default: ""
      dmg-filename:
        description: "DMG filename (e.g. Miragon.BPMN.Modeler-0.0.4-arm64.dmg)"
        required: false
        type: string
        default: ""
      dry-run:
        description: "Generate formula without pushing to tap"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  update-tap:
    name: Update Cask formula
    runs-on: ubuntu-latest
    # No environment gate: in the release chain this job runs after
    # publish-standalone.yml, which is already approved via the `standalone`
    # environment. A second `homebrew-tap` gate here would force a redundant
    # approval (GitHub requires one approval per job that targets a protected
    # environment). The App credentials must therefore be repo/org-level.
    permissions:
      contents: read
    steps:
      - name: Resolve tag and DMG metadata
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SHA: ${{ inputs.dmg-sha256 }}
          INPUT_FILENAME: ${{ inputs.dmg-filename }}
        run: |
          VERSION="$INPUT_VERSION"
          TAG="vscode-v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ -n "$INPUT_SHA" ] && [ -n "$INPUT_FILENAME" ]; then
            echo "skip-download=true" >> "$GITHUB_OUTPUT"
            echo "sha256=$INPUT_SHA" >> "$GITHUB_OUTPUT"
            echo "filename=$INPUT_FILENAME" >> "$GITHUB_OUTPUT"
            echo "Using sha256 + filename from orchestrator inputs (skipping DMG download)."
          else
            echo "skip-download=false" >> "$GITHUB_OUTPUT"
            echo "Will download DMG from release to recompute sha256 + filename."
          fi

      - name: Download DMG and compute sha256 (fallback)
        if: steps.meta.outputs.skip-download == 'false'
        id: sha
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="Miragon.BPMN.Modeler-${VERSION}-arm64.dmg"
          URL="https://github.com/Miragon/bpmn-modeler/releases/download/${TAG}/${DMG}"
          echo "Downloading $URL"
          curl -fsSL -o "$DMG" "$URL"
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "filename=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha256: $SHA"

      - name: Resolve final sha256 and filename
        id: final
        env:
          ORCH_SHA: ${{ steps.meta.outputs.sha256 }}
          ORCH_FILE: ${{ steps.meta.outputs.filename }}
          FALLBACK_SHA: ${{ steps.sha.outputs.sha256 }}
          FALLBACK_FILE: ${{ steps.sha.outputs.filename }}
        run: |
          SHA="${ORCH_SHA:-$FALLBACK_SHA}"
          FILE="${ORCH_FILE:-$FALLBACK_FILE}"
          if [ -z "$SHA" ] || [ -z "$FILE" ]; then
            echo "Failed to resolve DMG sha256/filename." && exit 1
          fi
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "filename=$FILE" >> "$GITHUB_OUTPUT"

      - name: Generate Cask formula
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ steps.final.outputs.sha256 }}
          FILENAME: ${{ steps.final.outputs.filename }}
        run: |
          URL_FILENAME="${FILENAME// /%20}"
          cat > miragon-bpmn-modeler.rb <<EOF
          cask "miragon-bpmn-modeler" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/Miragon/bpmn-modeler/releases/download/${TAG}/${URL_FILENAME}"
            name "Miragon BPMN Modeler"
            desc "Standalone BPMN/DMN process modeler"
            homepage "https://github.com/Miragon/bpmn-modeler"

            app "Miragon BPMN Modeler.app"
          end
          EOF
          echo "--- Generated formula ---"
          cat miragon-bpmn-modeler.rb

      - name: Generate App token for homebrew-tap
        if: ${{ !inputs.dry-run }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: Miragon
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      # The tap asks for an approval on commits it cannot attribute to the pusher, so the cask
      # is written through the contents API: GitHub signs that commit as the App's.
      - name: Open and squash-merge PR on homebrew-tap
        if: ${{ !inputs.dry-run }}
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAP: Miragon/homebrew-tap
          CASK: Casks/miragon-bpmn-modeler.rb
        run: |
          BRANCH="miragon-bpmn-modeler-${VERSION}"
          TITLE="chore: update miragon-bpmn-modeler to ${VERSION}"
          CURRENT=$(gh api "repos/${TAP}/contents/${CASK}?ref=main" --jq .sha 2>/dev/null) || CURRENT=""
          MAIN=$(gh api "repos/${TAP}/git/ref/heads/main" --jq .object.sha)
          gh api -X DELETE "repos/${TAP}/git/refs/heads/${BRANCH}" > /dev/null 2>&1 || true
          gh api "repos/${TAP}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="$MAIN" > /dev/null
          gh api -X PUT "repos/${TAP}/contents/${CASK}" -f branch="$BRANCH" -f message="$TITLE" \
            -f content="$(base64 -w0 miragon-bpmn-modeler.rb)" ${CURRENT:+-f sha="$CURRENT"} > /dev/null
          gh pr create --repo "$TAP" --base main --head "$BRANCH" \
            --title "$TITLE" --body "Automated Cask update for release vscode-v${VERSION}."
          gh pr merge "$BRANCH" --repo "$TAP" --squash --delete-branch

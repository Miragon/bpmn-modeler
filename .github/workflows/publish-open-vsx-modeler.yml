name: Publish Open VSX Modeler

# Builds and publishes the VS Code extension to the Open VSX Registry.
# Dry-run uploads a vsix artifact; non-dry-run publishes using the version in
# apps/vscode-plugin/package.json, authenticated by Open VSX Trusted Publishing
# (GitHub OIDC).
# workflow_dispatch is DRY-RUN ONLY: Open VSX matches the workflow in the
# token's workflow_ref, which names the top-level caller, and the trusted
# publisher is registered for release-please.yml and the open-vsx-marketplace
# environment. To re-run a failed real publish, re-run the open-vsx job on the
# release-please.yml run.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to check out (e.g. vscode-v1.2.3). Empty = current branch.'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Dry run (build + package, do not publish). Manual dispatch is always dry-run.'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to check out (e.g. vscode-v1.2.3). Empty = current branch.'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Dry run (build + package, do not publish)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  deployments: write
  id-token: write

concurrency:
  group: bpmn-modeler-open-vsx-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    env:
      EFFECTIVE_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' || inputs.dry-run) && 'true' || 'false' }}
    # Only real publishes run in the open-vsx-marketplace environment, which
    # the trusted publisher requires in the OIDC token; dry-runs stay ungated.
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' || inputs.dry-run) && '' || 'open-vsx-marketplace' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check pinned dependencies
        uses: Miragon/pin-npm-dependencies@3f7f02fa2454cdd2cdb65df19b081c0d77d301a5 # v1.2.2

      - name: Corepack enable
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler vs-code-bpmn-modeler @miragon/bpmn-modeler-webview @miragon/dmn-modeler-webview @miragon/form-modeler-webview @miragon/bpmn-modeler-deployment-webview @miragon/bpmn-modeler-add-ons-webview @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-types @miragon/bpmn-modeler-core @miragon/bpmn-modeler-append-menu @miragon/bpmn-modeler-clipboard @miragon/bpmn-modeler-i18n-extras @miragon/bpmn-modeler-element-template-chooser

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./apps/vscode-plugin/package.json').version)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: yarn build

      - name: Install vsce
        run: npm install -g @vscode/vsce@3.2.2

      - name: Package vsix
        working-directory: dist/apps/vscode-plugin
        run: vsce package --out bpmn-modeler-plugin.vsix --yarn --no-dependencies

      - name: Upload vsix artifact (dry-run)
        if: env.EFFECTIVE_DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-vsx-bpmn-modeler-plugin-v${{ steps.version.outputs.version }}
          path: dist/apps/vscode-plugin/bpmn-modeler-plugin.vsix
          retention-days: 7

      - name: Publish to Open VSX Marketplace
        if: env.EFFECTIVE_DRY_RUN == 'false'
        working-directory: dist/apps/vscode-plugin
        run: npx ovsx@1.3.0 publish --trusted-publishing --packagePath bpmn-modeler-plugin.vsix

      # Record a per-host deployment so the repo Environments page shows the
      # Open VSX extension's last-published version. The environment
      # auto-creates on first deployment.
      - name: Record deployment
        if: env.EFFECTIVE_DRY_RUN == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const version = "${{ steps.version.outputs.version }}";
            const publishedRef = "${{ inputs.tag || github.sha }}";
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: publishedRef,
              environment: "open-vsx-marketplace",
              description: `Open VSX extension v${version}`,
              required_contexts: [],
              auto_merge: false,
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment_url: "https://open-vsx.org/extension/miragon-gmbh/vs-code-bpmn-modeler",
              description: `Open VSX extension v${version} published`,
            });

name: Publish VS Code Modeler

# Builds and publishes the VS Code extension. Manual workflow_dispatch only;
# dry-run uploads a vsix artifact, non-dry-run publishes to the VS Code
# Marketplace using the version in apps/vscode-plugin/package.json.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to check out (e.g. vscode-v1.2.3). Empty = current branch.'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Dry run (build + package, do not publish)'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to check out (e.g. vscode-v1.2.3). Empty = current branch.'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Dry run (build + package, do not publish)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  deployments: write

concurrency:
  group: bpmn-modeler-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Gate only real publishes behind the vscode-marketplace environment so
    # VSCE_PUBLISH stays behind the environment's protection rules. VSCE_PUBLISH
    # is read solely in the dry-run == false publish step, so an empty
    # environment name leaves dry-runs ungated (no approval wait).
    environment:
      name: ${{ inputs.dry-run == false && 'vscode-marketplace' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check pinned dependencies
        uses: Miragon/pin-npm-dependencies@58fe24377aef66748a1444ff69ab05e3f938a798 # v1.2.1

      - name: Corepack enable
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler vs-code-bpmn-modeler @miragon/bpmn-modeler-webview @miragon/dmn-modeler-webview @miragon/bpmn-modeler-deployment-webview @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-types @miragon/bpmn-modeler-core @miragon/bpmn-modeler-append-menu @miragon/bpmn-modeler-clipboard @miragon/bpmn-modeler-i18n-extras @miragon/bpmn-modeler-element-template-chooser

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./apps/vscode-plugin/package.json').version)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: yarn build

      - name: Install vsce
        run: npm install -g @vscode/vsce@3.2.2

      - name: Package vsix
        working-directory: dist/apps/vscode-plugin
        run: vsce package --out bpmn-modeler-plugin.vsix --yarn --no-dependencies

      - name: Upload vsix artifact (dry-run)
        if: inputs.dry-run == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bpmn-modeler-plugin-v${{ steps.version.outputs.version }}
          path: dist/apps/vscode-plugin/bpmn-modeler-plugin.vsix
          retention-days: 7

      - name: Publish to VS Code Marketplace
        if: inputs.dry-run == false
        working-directory: dist/apps/vscode-plugin
        run: vsce publish --yarn --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PUBLISH }}

      # Record a per-host deployment so the repo Environments page shows the
      # VS Code extension's last-published version. The environment
      # auto-creates on first deployment.
      - name: Record deployment
        if: inputs.dry-run == false
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const version = "${{ steps.version.outputs.version }}";
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: "vscode-marketplace",
              description: `VS Code extension v${version}`,
              required_contexts: [],
              auto_merge: false,
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment_url: "https://marketplace.visualstudio.com/items?itemName=miragon-gmbh.vs-code-bpmn-modeler",
              description: `VS Code extension v${version} published`,
            });

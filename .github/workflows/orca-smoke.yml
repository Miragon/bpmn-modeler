name: Orca smoke

# The built Orca plugin in a real Orca (apps/orca-plugin/test/smoke, `test:orca`):
# load with approval, render, both themes, undo, a saved edit, an agent's write
# and the plugin's logs, for a .bpmn and a .dmn file. On the newest Orca release
# and on the oldest that `engines.orca` accepts. A workflow of its own and not a
# required check, like the VS Code smoke; the weekly run catches a new Orca
# release breaking the plugin without a change here.
on:
  pull_request:
    paths:
      - 'apps/orca-plugin/**'
      - 'packages/bpmn-modeler/**'
      - 'packages/dmn-modeler/**'
      - 'libs/**'
      - '!libs/standalone-extension/**'
      - '!libs/modeler-core/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - 'tsconfig.base.json'
      - '.github/workflows/orca-smoke.yml'
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: orca-smoke-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  orca-smoke:
    name: Orca smoke / ${{ matrix.orca }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        orca: [latest, minimum]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspaces
        with:
          focus: "@miragon/bpmn-modeler-orca bpmn-modeler @miragon/bpmn-modeler @miragon/dmn-modeler @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-types @miragon/bpmn-modeler-i18n-extras @miragon/bpmn-modeler-append-menu @miragon/bpmn-modeler-element-template-chooser @miragon/bpmn-modeler-clipboard"
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: yarn workspace @miragon/bpmn-modeler-orca build

      # The minimum comes from engines.orca, so raising the floor moves the smoke along.
      - id: orca
        name: Resolve the Orca version
        env:
          CHANNEL: ${{ matrix.orca }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$CHANNEL" == minimum ]]; then
            version=$(node -p "require('./apps/orca-plugin/orca-plugin.json').engines.orca.replace(/^>=/, '')")
          else
            version=$(gh release view --repo stablyai/orca --json tagName --jq '.tagName | ltrimstr("v")')
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No Orca version for $CHANNEL: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ runner.temp }}/orca
          key: orca-${{ runner.os }}-${{ runner.arch }}-${{ steps.orca.outputs.version }}

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Download and extract the Orca AppImage
        env:
          VERSION: ${{ steps.orca.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/orca" && cd "$RUNNER_TEMP/orca"
          gh release download "v$VERSION" --repo stablyai/orca --pattern orca-linux.AppImage
          chmod +x orca-linux.AppImage
          ./orca-linux.AppImage --appimage-extract > /dev/null
          rm orca-linux.AppImage

      - name: Run the Orca smoke test
        run: xvfb-run -a yarn workspace @miragon/bpmn-modeler-orca test:orca
        env:
          ORCA_APP: ${{ runner.temp }}/orca/squashfs-root

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orca-smoke-${{ matrix.orca }}
          path: apps/orca-plugin/test-results/orca-smoke/
          if-no-files-found: ignore
          retention-days: 7

name: Publish IntelliJ Plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  deployments: write

concurrency:
  group: bpmn-modeler-intellij-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: jetbrains-marketplace

    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [[ "$TAG" != v* ]]; then
            echo "Tag '$TAG' is not a v* tag; aborting." && exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check pinned dependencies
        uses: Miragon/pin-npm-dependencies@v1.2.1

      - name: Corepack enable
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn

      - name: Setup JDK 21
        uses: actions/setup-java@v5.4.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      # Bun is needed for cross-compiling the bridge to all 5 targets.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler @miragon/bpmn-modeler-webview @miragon/bpmn-modeler-deployment-webview @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-core @miragon/bpmn-modeler-bridge @miragon/bpmn-modeler-append-menu @miragon/bpmn-modeler-clipboard @miragon/bpmn-modeler-i18n @miragon/bpmn-modeler-element-template-chooser

      - name: Build shared libraries
        run: yarn build:libs

      - name: Build bpmn-webview
        run: yarn build:bpmn-webview

      - name: Build deployment-webview
        run: yarn build:deployment-webview

      - name: Cross-compile bridge for all platforms
        run: yarn workspace @miragon/bpmn-modeler-bridge compile:all

      - name: Build plugin ZIP (all platforms)
        working-directory: apps/intellij-plugin
        run: ./gradlew buildPlugin -PbundleAllPlatforms --no-daemon

      - name: Locate plugin ZIP
        id: zip
        run: |
          ZIP=$(ls apps/intellij-plugin/build/distributions/*.zip | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No plugin ZIP produced by buildPlugin." && exit 1
          fi
          echo "path=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: Generate App token
        uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Upload ZIP to release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" "${{ steps.zip.outputs.path }}" --clobber

      - name: Publish to JetBrains Marketplace
        working-directory: apps/intellij-plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: ./gradlew publishPlugin -PbundleAllPlatforms --no-daemon

      # Regenerate the custom-repository descriptor.
      # IntellIJ Marketplace requires this
      - name: Regenerate updatePlugins.xml
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/${{ steps.zip.outputs.name }}"
          node .github/scripts/generate-update-plugins-xml.mjs \
            --version "${{ steps.tag.outputs.version }}" \
            --download-url "$DOWNLOAD_URL"

      - name: Commit updatePlugins.xml to main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          XML_PATH="docs/public/updatePlugins.xml"
          NEW_B64=$(base64 -w0 "$XML_PATH")

          commit_xml() {
            # expectedHeadOid makes this an optimistic-concurrency write: the
            # mutation is rejected if main moved since we read its head. gh
            # exits 0 on a GraphQL-level error (HTTP 200 with an `errors`
            # array), so we must inspect the body, not just the exit code.
            local head_oid="$1" resp
            resp=$(jq -n \
              --arg repo "${{ github.repository }}" \
              --arg oid "$head_oid" \
              --arg path "$XML_PATH" \
              --arg contents "$NEW_B64" \
              --arg headline "ci(release): refresh updatePlugins.xml for v${{ steps.tag.outputs.version }}" \
              '{query: "mutation($i: CreateCommitOnBranchInput!){createCommitOnBranch(input:$i){commit{oid}}}",
                variables: {i: {
                  branch: {repositoryNameWithOwner: $repo, branchName: "main"},
                  expectedHeadOid: $oid,
                  message: {headline: $headline},
                  fileChanges: {additions: [{path: $path, contents: $contents}]}
                }}}' \
              | gh api graphql --input - 2>&1) || { echo "$resp" >&2; return 1; }
            if printf '%s' "$resp" | grep -q '"errors"'; then
              echo "$resp" >&2
              return 1
            fi
          }

          for attempt in 1 2 3; do
            # Guard the head read so a transient API error (5xx / secondary
            # rate limit) retries instead of aborting the step via `set -e` —
            # the retry loop must cover the read it depends on, not just the
            # commit mutation below.
            HEAD_OID=$(gh api "repos/${{ github.repository }}/branches/main" --jq .commit.sha) || {
              echo "Reading main head failed on attempt ${attempt}; retrying." >&2
              sleep 3
              continue
            }

            # Skip when main already carries this exact XML so re-publishing an
            # unchanged descriptor doesn't create a no-op commit (and an
            # unnecessary deploy-docs run). A 404 (file absent) leaves
            # CURRENT_B64 empty and falls through to the commit.
            CURRENT_B64=$(gh api "repos/${{ github.repository }}/contents/${XML_PATH}?ref=main" --jq .content 2>/dev/null | tr -d '\n' || true)
            if [ -n "$CURRENT_B64" ] && [ "$(printf '%s' "$CURRENT_B64" | base64 -d | base64 -w0)" = "$NEW_B64" ]; then
              echo "updatePlugins.xml is unchanged on main; nothing to commit."
              exit 0
            fi

            if commit_xml "$HEAD_OID"; then
              echo "Committed updatePlugins.xml to main (was head ${HEAD_OID})."
              exit 0
            fi

            echo "createCommitOnBranch attempt ${attempt} failed (main head may have moved); retrying." >&2
            sleep 3
          done

          echo "Failed to commit updatePlugins.xml to main after 3 attempts." >&2
          exit 1

      - name: Record deployment
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const version = "${{ steps.tag.outputs.version }}";
            const tag = "${{ steps.tag.outputs.tag }}";
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: tag,
              environment: "jetbrains-marketplace",
              description: `IntelliJ plugin v${version}`,
              required_contexts: [],
              auto_merge: false,
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`,
              description: `IntelliJ plugin v${version} published`,
            });

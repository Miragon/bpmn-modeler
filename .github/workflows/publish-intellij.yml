name: Publish IntelliJ Plugin

# Manual publish for the IntelliJ plugin. Dispatched against a unified
# `v<version>` release tag (cut by release-please). Cross-compiles the
# modeler-bridge for all 5 supported platforms, builds the plugin ZIP with
# every binary staged, uploads it to that release, then regenerates
# docs/public/updatePlugins.xml so the JetBrains custom-repository descriptor
# served via GitHub Pages advertises the new version. Pushing the
# regenerated XML to main triggers deploy-docs.yml automatically.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  deployments: write

concurrency:
  group: bpmn-modeler-intellij-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Gate the production publish behind the jetbrains-marketplace environment
    # so the publish action itself only proceeds after the environment's
    # protection rules (required reviewers / branch restrictions) pass. The
    # credential is now the miragon-release-please App key (a repo/org secret,
    # readable by env-gated jobs), so the gate protects the act of publishing,
    # not a PAT-scoped secret. No dry-run input — every run publishes — so the
    # gate applies unconditionally.
    environment: jetbrains-marketplace

    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [[ "$TAG" != v* ]]; then
            echo "Tag '$TAG' is not a v* tag; aborting." && exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check pinned dependencies
        uses: Miragon/pin-npm-dependencies@v1

      - name: Corepack enable
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      # JDK 21 matches kotlin.jvmToolchain(21) in build.gradle.kts — otherwise
      # Gradle downloads its own toolchain on every run.
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Bun is needed for cross-compiling the bridge to all 5 targets. The
      # `latest` channel tracks releases ≥ 1.1.5 which supports `--target`.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler @miragon/bpmn-modeler-webview @miragon/bpmn-modeler-deployment-webview @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-core @miragon/bpmn-modeler-bridge @miragon/bpmn-modeler-append-menu @miragon/bpmn-modeler-clipboard @miragon/bpmn-modeler-i18n @miragon/bpmn-modeler-element-template-chooser

      # The Gradle build only stages already-built artefacts; the JS/Bun side
      # produces them. Build order: shared libs → webview bundles → bridge.
      - name: Build shared libraries
        run: yarn build:libs

      - name: Build bpmn-webview
        run: yarn build:bpmn-webview

      - name: Build deployment-webview
        run: yarn build:deployment-webview

      - name: Cross-compile bridge for all platforms
        run: yarn workspace @miragon/bpmn-modeler-bridge compile:all

      - name: Build plugin ZIP (all platforms)
        working-directory: apps/intellij-plugin
        run: ./gradlew buildPlugin -PbundleAllPlatforms --no-daemon

      - name: Locate plugin ZIP
        id: zip
        run: |
          ZIP=$(ls apps/intellij-plugin/build/distributions/*.zip | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No plugin ZIP produced by buildPlugin." && exit 1
          fi
          echo "path=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

      # #1093 acceptance criterion: log per-platform binary size and total
      # ZIP size so we can spot if Bun's runtime bloats the artefact.
      - name: Record artefact sizes
        run: |
          {
            echo "## IntelliJ plugin ZIP"
            echo
            echo "- Tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- Version: \`${{ steps.tag.outputs.version }}\`"
            ZIP="${{ steps.zip.outputs.path }}"
            ZIP_SIZE=$(du -h "$ZIP" | awk '{print $1}')
            echo "- ZIP: \`$(basename "$ZIP")\` ($ZIP_SIZE)"
            echo
            echo "### Per-platform bridge binary sizes"
            echo
            echo "| Platform | Binary | Size |"
            echo "|----------|--------|------|"
            for d in apps/modeler-bridge/dist/*/; do
              platform=$(basename "$d")
              for f in "$d"modeler-bridge*; do
                if [ -f "$f" ]; then
                  size=$(du -h "$f" | awk '{print $1}')
                  echo "| $platform | $(basename "$f") | $size |"
                fi
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Mint the App token here, after the long cross-compile + Gradle build,
      # rather than at job start: installation tokens expire after 1 hour and
      # the build alone could approach that window. A late token gives a fresh
      # ~1h for the quick tail (release upload + push to main). The push needs a
      # non-GITHUB_TOKEN credential so the resulting commit triggers
      # deploy-docs.yml — same reason release-please uses this App.
      - name: Generate App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Upload ZIP to release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" "${{ steps.zip.outputs.path }}" --clobber

      # Regenerate the custom-repository descriptor. The download URL is
      # composed from the tag and the ZIP filename so the IDE polls the
      # exact asset we just uploaded.
      - name: Regenerate updatePlugins.xml
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/${{ steps.zip.outputs.name }}"
          node .github/scripts/generate-update-plugins-xml.mjs \
            --version "${{ steps.tag.outputs.version }}" \
            --download-url "$DOWNLOAD_URL"

      # Commit the regenerated XML to main via the GraphQL
      # createCommitOnBranch mutation instead of a local `git push`. A pushed
      # local commit is unsigned and would only land by punching through the
      # branch ruleset's required_signatures rule; an API-created commit is
      # signed with GitHub's key (verified), so it satisfies that rule honestly.
      # The App installation token (not GITHUB_TOKEN) authors it, so the
      # resulting push to main still triggers deploy-docs.yml. No working-tree
      # branch switch is needed — we send the file the previous step generated.
      - name: Commit updatePlugins.xml to main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          XML_PATH="docs/public/updatePlugins.xml"
          NEW_B64=$(base64 -w0 "$XML_PATH")

          commit_xml() {
            # expectedHeadOid makes this an optimistic-concurrency write: the
            # mutation is rejected if main moved since we read its head. gh
            # exits 0 on a GraphQL-level error (HTTP 200 with an `errors`
            # array), so we must inspect the body, not just the exit code.
            local head_oid="$1" resp
            resp=$(jq -n \
              --arg repo "${{ github.repository }}" \
              --arg oid "$head_oid" \
              --arg path "$XML_PATH" \
              --arg contents "$NEW_B64" \
              --arg headline "chore(release): refresh updatePlugins.xml for v${{ steps.tag.outputs.version }}" \
              '{query: "mutation($i: CreateCommitOnBranchInput!){createCommitOnBranch(input:$i){commit{oid}}}",
                variables: {i: {
                  branch: {repositoryNameWithOwner: $repo, branchName: "main"},
                  expectedHeadOid: $oid,
                  message: {headline: $headline},
                  fileChanges: {additions: [{path: $path, contents: $contents}]}
                }}}' \
              | gh api graphql --input - 2>&1) || { echo "$resp" >&2; return 1; }
            if printf '%s' "$resp" | grep -q '"errors"'; then
              echo "$resp" >&2
              return 1
            fi
          }

          for attempt in 1 2 3; do
            # Guard the head read so a transient API error (5xx / secondary
            # rate limit) retries instead of aborting the step via `set -e` —
            # the retry loop must cover the read it depends on, not just the
            # commit mutation below.
            HEAD_OID=$(gh api "repos/${{ github.repository }}/branches/main" --jq .commit.sha) || {
              echo "Reading main head failed on attempt ${attempt}; retrying." >&2
              sleep 3
              continue
            }

            # Skip when main already carries this exact XML so re-publishing an
            # unchanged descriptor doesn't create a no-op commit (and an
            # unnecessary deploy-docs run). A 404 (file absent) leaves
            # CURRENT_B64 empty and falls through to the commit.
            CURRENT_B64=$(gh api "repos/${{ github.repository }}/contents/${XML_PATH}?ref=main" --jq .content 2>/dev/null | tr -d '\n' || true)
            if [ -n "$CURRENT_B64" ] && [ "$(printf '%s' "$CURRENT_B64" | base64 -d | base64 -w0)" = "$NEW_B64" ]; then
              echo "updatePlugins.xml is unchanged on main; nothing to commit."
              exit 0
            fi

            if commit_xml "$HEAD_OID"; then
              echo "Committed updatePlugins.xml to main (was head ${HEAD_OID})."
              exit 0
            fi

            echo "createCommitOnBranch attempt ${attempt} failed (main head may have moved); retrying." >&2
            sleep 3
          done

          echo "Failed to commit updatePlugins.xml to main after 3 attempts." >&2
          exit 1

      # Record a per-host deployment so the repo Environments page shows the
      # IntelliJ plugin's last-published version. The environment auto-creates
      # on first deployment.
      - name: Record deployment
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ steps.tag.outputs.version }}";
            const tag = "${{ steps.tag.outputs.tag }}";
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: tag,
              environment: "jetbrains-marketplace",
              description: `IntelliJ plugin v${version}`,
              required_contexts: [],
              auto_merge: false,
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`,
              description: `IntelliJ plugin v${version} published`,
            });

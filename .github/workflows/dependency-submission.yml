name: Dependency Submission

# Without a submitted snapshot the dependency graph holds none of the IntelliJ
# plugin's JVM dependencies, so Dependabot raises no alerts for them.
on:
  push:
    branches: [ main ]
    paths:
      - 'apps/intellij-plugin/**/*.gradle.kts'
      - 'apps/intellij-plugin/gradle/**'
      - 'apps/intellij-plugin/gradle.properties'
      - '.github/workflows/dependency-submission.yml'
  # A pull request only generates the graph, so a build change that breaks the
  # resolution fails before it reaches main.
  pull_request:
    paths:
      - 'apps/intellij-plugin/**/*.gradle.kts'
      - 'apps/intellij-plugin/gradle/**'
      - 'apps/intellij-plugin/gradle.properties'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gradle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The Dependency Submission API needs write; a pull request does not submit.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate and submit the Gradle dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: apps/intellij-plugin
          dependency-graph: ${{ github.event_name == 'pull_request' && 'generate-and-upload' || 'generate-and-submit' }}
          artifact-retention-days: 1

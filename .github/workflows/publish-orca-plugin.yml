name: Publish Orca plugin

# Builds the Orca plugin (apps/orca-plugin/plugin/), smoke-tests exactly that
# folder in the newest Orca, and publishes it into Miragon/orca-plugins with
# that repository's publish-plugin action: it opens a pull request with the
# plugin's bytes and then one with its catalog entry, and squash-merges each
# once that repository's `validate` passes. A failed publish closes its pull
# request; re-running this job retries and skips the bytes when they are on
# main there already. The `orca-plugins-publish` concurrency group serializes
# publishes from this repository only. Manual dispatch is dry-run-only
# (build + smoke); a real publish runs from release-please.yml after the
# release approval.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to check out (e.g. orca-v0.1.0). Empty = current branch.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to check out (e.g. orca-v0.1.0).'
        required: true
        type: string
      dry-run:
        description: 'Dry run (build + smoke, do not publish)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ${{ (github.event_name == 'workflow_dispatch' || inputs.dry-run) && format('orca-plugin-dry-run-{0}', github.run_id) || 'orca-plugins-publish' }}
      cancel-in-progress: false
    env:
      # A dispatch has no dry-run input, and `null == false` holds in an expression.
      EFFECTIVE_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' || inputs.dry-run) && 'true' || 'false' }}
      PLUGIN_DIR: apps/orca-plugin/plugin
      RELEASE_DIR: orca-plugins/bpmn-modeler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-workspaces
        with:
          focus: "@miragon/bpmn-modeler-orca bpmn-modeler @miragon/bpmn-modeler @miragon/dmn-modeler @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-types @miragon/bpmn-modeler-i18n-extras @miragon/bpmn-modeler-append-menu @miragon/bpmn-modeler-element-template-chooser @miragon/bpmn-modeler-clipboard"
      - run: yarn workspace @miragon/bpmn-modeler-orca build

      - id: orca
        uses: Miragon/orca-plugin-kit/actions/setup-orca@245eb67fd57c4aeb5c163fce5553be0a27b1311c # v2.0.0
        with:
          channel: latest
      - name: Smoke-test exactly this plugin folder in Orca
        run: xvfb-run -a yarn workspace @miragon/bpmn-modeler-orca test:orca
        env:
          ORCA_APP: ${{ steps.orca.outputs.app }}
          ORCA_SMOKE_PLUGIN: ${{ github.workspace }}/${{ env.PLUGIN_DIR }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orca-smoke-release
          path: apps/orca-plugin/test-results/orca-smoke/
          if-no-files-found: ignore
          retention-days: 7

      - name: Hand the smoke-tested folder, tag and changelog section to the publish
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RELEASE_DIR"
          cp -R "$PLUGIN_DIR" "$RELEASE_DIR/plugin"
          section=$(awk '/^## /{n++} n==1' apps/orca-plugin/CHANGELOG.md 2>/dev/null | tail -n +2 | head -c 1900 || true)
          jq -n --arg tag "$TAG" --arg changelog "$section" '{tag: $tag, changelog: $changelog}' > "$RELEASE_DIR/release.json"

      - if: env.EFFECTIVE_DRY_RUN == 'false'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: miragon
          repositories: orca-plugins
      - if: env.EFFECTIVE_DRY_RUN == 'false'
        uses: Miragon/orca-plugin-kit/actions/publish-plugin@245eb67fd57c4aeb5c163fce5553be0a27b1311c # v2.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          plugins-dir: orca-plugins
          source-repo: ${{ github.repository }}
          source-ref: ${{ steps.source.outputs.commit }}

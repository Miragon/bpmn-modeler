name: PR Labeler

# Labels each PR with the top-level workspace dirs it touches (apps/*, libs/*)
# for a quick "what does this change" overview. Type labels (feat/fix/…) used to
# live here too, to drive the GitHub release notes — that job was dropped once
# release-please took over the changelog (it reads commit types, not labels).
on:
  pull_request:
    # Only opened/synchronize: labels track changed paths, which an `edited`
    # title/body change can't affect.
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  labelPR:
    name: Label PR With Repo(s)
    runs-on: ubuntu-latest
    steps:
      - name: Label PRs
        uses: tinkurlab/monorepo-pr-labeler-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_DIRS: "apps|libs"

name: Release attribution

# On the release PR, fails when a feat or fix since a line's last tag lacks its
# attribution commit, and prints the reconcile run that adds it. Every other PR
# passes at once, so the check can be required without blocking them.
# release-please pushes the release branch after every push to main, so the
# check re-runs once a reconcile has written the attributions.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Release attribution
    runs-on: ubuntu-latest
    steps:
      - if: github.head_ref != 'release-please--branches--main'
        run: echo "Not the release PR; nothing to check."

      - if: github.head_ref == 'release-please--branches--main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main's history and tags, not the release branch's merge ref.
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - if: github.head_ref == 'release-please--branches--main'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check the attributions since each line's last tag
        if: github.head_ref == 'release-please--branches--main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-routing.mjs audit

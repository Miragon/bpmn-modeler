name: Release Please

# Three release lines (see release-please-config.json): "." (vscode),
# "apps/intellij-plugin" (intellij) and "packages/bpmn-modeler" (npm), each with
# its own Release PR, tag and publish jobs.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  deployments: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR
    runs-on: ubuntu-latest
    outputs:
      vscode_released: ${{ steps.release.outputs.release_created }}
      vscode_tag: ${{ steps.release.outputs.tag_name }}
      vscode_version: ${{ steps.release.outputs.version }}
      intellij_released: ${{ steps.release.outputs['apps/intellij-plugin--release_created'] }}
      intellij_tag: ${{ steps.release.outputs['apps/intellij-plugin--tag_name'] }}
      npm_released: ${{ steps.release.outputs['packages/bpmn-modeler--release_created'] }}
      npm_tag: ${{ steps.release.outputs['packages/bpmn-modeler--tag_name'] }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  approve-release:
    name: Approve release publish
    needs: release-please
    if: needs.release-please.outputs.vscode_released == 'true' || needs.release-please.outputs.intellij_released == 'true' || needs.release-please.outputs.npm_released == 'true'
    runs-on: ubuntu-latest
    environment: release-approval
    steps:
      - name: Record approval
        run: echo "Release approved — vscode=${{ needs.release-please.outputs.vscode_tag }} intellij=${{ needs.release-please.outputs.intellij_tag }} npm=${{ needs.release-please.outputs.npm_tag }}"

  vscode:
    needs: [release-please, approve-release]
    if: needs.release-please.outputs.vscode_released == 'true'
    uses: ./.github/workflows/publish-vscode-modeler.yml
    with:
      tag: ${{ needs.release-please.outputs.vscode_tag }}
      dry-run: false
    secrets: inherit

  open-vsx:
    needs: [release-please, approve-release]
    if: needs.release-please.outputs.vscode_released == 'true'
    uses: ./.github/workflows/publish-open-vsx-modeler.yml
    with:
      tag: ${{ needs.release-please.outputs.vscode_tag }}
      dry-run: false
    secrets: inherit

  standalone:
    needs: [release-please, approve-release]
    if: needs.release-please.outputs.vscode_released == 'true'
    uses: ./.github/workflows/release-standalone.yml
    with:
      version: ${{ needs.release-please.outputs.vscode_version }}
      dry-run: false
    secrets: inherit

  intellij:
    needs: [release-please, approve-release]
    if: needs.release-please.outputs.intellij_released == 'true'
    uses: ./.github/workflows/publish-intellij.yml
    with:
      tag: ${{ needs.release-please.outputs.intellij_tag }}
    secrets: inherit

  npm:
    needs: [release-please, approve-release]
    if: needs.release-please.outputs.npm_released == 'true'
    # id-token: write is required in BOTH this caller job and the called
    # workflow for npm Trusted Publishing (OIDC) to mint a provenance token.
    permissions:
      contents: read
      deployments: write
      id-token: write
    uses: ./.github/workflows/publish-npm-modeler.yml
    with:
      tag: ${{ needs.release-please.outputs.npm_tag }}
      dry-run: false
    secrets: inherit

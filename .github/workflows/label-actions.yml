name: Label Actions

# Reacts to maintainer labels on issues (see .github/label-actions.yml):
# `accepted` clears `needs-triage`, `wontfix` closes with a kind note.

on:
  issues:
    types: [labeled, unlabeled]

permissions:
  contents: read
  issues: write

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/label-actions@65225c179d3b2502f6eda7b3d15101a3f412366b # v5

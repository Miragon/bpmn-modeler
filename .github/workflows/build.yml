name: Build

on:
  push:
  pull_request:
    types: [ opened, reopened, synchronize ]

permissions:
  contents: read

# Workflow-level so a superseded PR run is cancelled as a single unit: the `ci`
# rollup then resolves to `cancelled` (not `failure`), and branch protection only
# evaluates the latest SHA's run — no spurious gate failure. `main` pushes are
# never cancelled (the expression is false on `refs/heads/main`), so back-stop
# runs always complete. Also frees CI minutes by cancelling every superseded job,
# not just the e2e smoke test.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      bpmn-i18n: ${{ steps.filter.outputs.bpmn-i18n }}
      element-template-chooser: ${{ steps.filter.outputs.element-template-chooser }}
      append-menu: ${{ steps.filter.outputs.append-menu }}
      bpmn-clipboard: ${{ steps.filter.outputs.bpmn-clipboard }}
      modeler-core: ${{ steps.filter.outputs.modeler-core }}
      modeler-bridge: ${{ steps.filter.outputs.modeler-bridge }}
      vscode-plugin: ${{ steps.filter.outputs.vscode-plugin }}
      vscode-plugin-src: ${{ steps.filter.outputs.vscode-plugin-src }}
      intellij-plugin: ${{ steps.filter.outputs.intellij-plugin }}
      modeler-core-src: ${{ steps.filter.outputs.modeler-core-src }}
      modeler-bridge-src: ${{ steps.filter.outputs.modeler-bridge-src }}
      bpmn-webview: ${{ steps.filter.outputs.bpmn-webview }}
      dmn-webview: ${{ steps.filter.outputs.dmn-webview }}
      deployment-webview: ${{ steps.filter.outputs.deployment-webview }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dorny/paths-filter@v4.0.1
        id: filter
        with:
          # `every` makes the `!`-negation patterns in the `*-src` filters below
          # actually exclude — without it negations are inert. Safe globally
          # because every other filter is a single positive pattern, for which
          # `every` is identical to the default `any`.
          predicate-quantifier: 'every'
          filters: |
            shared:
              - 'libs/shared/**'
            bpmn-i18n:
              - 'libs/bpmn-i18n/**'
            element-template-chooser:
              - 'libs/element-template-chooser/**'
            append-menu:
              - 'libs/append-menu/**'
            bpmn-clipboard:
              - 'libs/bpmn-clipboard/**'
            modeler-core:
              - 'libs/modeler-core/**'
            modeler-bridge:
              - 'apps/modeler-bridge/**'
            vscode-plugin:
              - 'apps/vscode-plugin/**'
            # No `*-src` split: release-please bumps the version inside
            # build.gradle.kts (not a dedicated file), so there is no clean way to
            # exclude a version-only change — a redundant coverage upload on a
            # version-bump PR is harmless (Codecov dedups by commit).
            intellij-plugin:
              - 'apps/intellij-plugin/**'
            # `*-src` mirror the package filters above but drop package.json, so a
            # version-bump-only PR (release-please) skips the Codecov coverage
            # report while build+test still run via the broad filters. Relies on
            # `predicate-quantifier: every` to honour the negation.
            vscode-plugin-src:
              - 'apps/vscode-plugin/**'
              - '!apps/vscode-plugin/package.json'
            modeler-core-src:
              - 'libs/modeler-core/**'
              - '!libs/modeler-core/package.json'
            modeler-bridge-src:
              - 'apps/modeler-bridge/**'
              - '!apps/modeler-bridge/package.json'
            bpmn-webview:
              - 'apps/bpmn-webview/**'
            dmn-webview:
              - 'apps/dmn-webview/**'
            deployment-webview:
              - 'apps/deployment-webview/**'
            docs:
              - 'docs/**'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: Miragon/pin-npm-dependencies@v1.2.1
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install Linux build deps for Theia native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies
        run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn lint
      - run: yarn format:check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: Miragon/pin-npm-dependencies@v1.2.1
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install Linux build deps for Theia native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies
        run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn npm audit --all --severity high

  build-shared:
    needs: detect-changes
    if: needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn
      - run: yarn workspaces focus @miragon/bpmn-modeler-shared
      - run: yarn workspace @miragon/bpmn-modeler-shared build

  build-bpmn-i18n:
    needs: detect-changes
    if: needs.detect-changes.outputs.bpmn-i18n == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn
      - run: yarn workspaces focus @miragon/bpmn-modeler-i18n
      - run: yarn workspace @miragon/bpmn-modeler-i18n build

  build-element-template-chooser:
    needs: detect-changes
    if: needs.detect-changes.outputs.element-template-chooser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn
      - run: yarn workspaces focus @miragon/bpmn-modeler-element-template-chooser
      - run: yarn workspace @miragon/bpmn-modeler-element-template-chooser build

  build-append-menu:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.append-menu == 'true' ||
      needs.detect-changes.outputs.element-template-chooser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn
      - run: yarn workspaces focus @miragon/bpmn-modeler-append-menu
      - run: yarn workspace @miragon/bpmn-modeler-append-menu build

  build-bpmn-clipboard:
    needs: detect-changes
    if: needs.detect-changes.outputs.bpmn-clipboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn
      - run: yarn workspaces focus @miragon/bpmn-modeler-clipboard
      - run: yarn workspace @miragon/bpmn-modeler-clipboard build

  build-vscode-plugin:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.vscode-plugin == 'true' ||
      needs.detect-changes.outputs.modeler-core == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      needs.detect-changes.outputs.bpmn-i18n == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install Linux build deps for Theia native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies (focused)
        run: yarn workspaces focus vs-code-bpmn-modeler @miragon/bpmn-modeler-core @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-i18n
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn workspace vs-code-bpmn-modeler build

  test-vscode-plugin:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.vscode-plugin == 'true' ||
      needs.detect-changes.outputs.modeler-core == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      needs.detect-changes.outputs.bpmn-i18n == 'true'
    runs-on: ubuntu-latest
    # `pull-requests: write` lets the coverage-report step post/update its
    # sticky PR comment; job-level scope keeps the broader workflow read-only.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install Linux build deps for Theia native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler vs-code-bpmn-modeler @miragon/bpmn-modeler-core @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-i18n
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn workspace vs-code-bpmn-modeler test
      # Post the coverage table as a sticky PR comment, but only when this
      # project's own files changed — a core/shared-only PR still runs these
      # tests (the plugin depends on them) yet should not surface a plugin
      # coverage comment. `if: always()` so it still reports when the per-layer
      # thresholds fail the test step above — that is exactly when you want to
      # see which layer dropped. `continue-on-error` so a read-only token on
      # fork PRs can't fail CI.
      - name: Report coverage on the PR
        if: >-
          always() && github.event_name == 'pull_request' &&
          needs.detect-changes.outputs.vscode-plugin-src == 'true'
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@v2.12.1
        with:
          # Paths resolve relative to working-directory; vitest writes the
          # reports to the repo-root coverage/ dir, two levels up.
          working-directory: apps/vscode-plugin
          json-summary-path: ../../coverage/apps/vscode-plugin/coverage-summary.json
          json-final-path: ../../coverage/apps/vscode-plugin/coverage-final.json
          name: vscode-plugin
      - name: Upload coverage to Codecov
        if: needs.detect-changes.outputs.vscode-plugin-src == 'true'
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: "./coverage/apps/vscode-plugin"
          fail_ci_if_error: false
          flags: vscode-plugin
          name: vscode-plugin
          verbose: true

  test-modeler-core:
    needs: detect-changes
    # Runs on its own changes and on shared (the engine depends on it). The
    # coverage report below is gated to this project's own files so a
    # shared-only PR doesn't surface a modeler-core coverage comment.
    if: >-
      needs.detect-changes.outputs.modeler-core == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    # `pull-requests: write` lets the coverage-report step post/update its
    # sticky PR comment; job-level scope keeps the broader workflow read-only.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler @miragon/bpmn-modeler-core @miragon/bpmn-modeler-shared
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn workspace @miragon/bpmn-modeler-core test
      # Sticky PR comment, only when this package's own files changed (see the
      # plugin job for the rationale). `if: always()` so a failed threshold
      # still reports which layer dropped; `continue-on-error` so a read-only
      # fork token can't fail CI.
      - name: Report coverage on the PR
        if: >-
          always() && github.event_name == 'pull_request' &&
          needs.detect-changes.outputs.modeler-core-src == 'true'
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@v2.12.1
        with:
          working-directory: libs/modeler-core
          json-summary-path: ../../coverage/libs/modeler-core/coverage-summary.json
          json-final-path: ../../coverage/libs/modeler-core/coverage-final.json
          name: modeler-core
      - name: Upload coverage to Codecov
        if: needs.detect-changes.outputs.modeler-core-src == 'true'
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: "./coverage/libs/modeler-core"
          fail_ci_if_error: false
          flags: modeler-core
          name: modeler-core
          verbose: true

  test-modeler-bridge:
    needs: detect-changes
    # Runs when the bridge, core, or shared changes — the bridge specs alias
    # both @miragon/bpmn-modeler-core and @miragon/bpmn-modeler-shared to their
    # TS sources, so a core/shared change can break the bridge tests too.
    if: >-
      needs.detect-changes.outputs.modeler-bridge == 'true' ||
      needs.detect-changes.outputs.modeler-core == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    # `pull-requests: write` lets the coverage-report step post/update its
    # sticky PR comment; job-level scope keeps the broader workflow read-only.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler @miragon/bpmn-modeler-bridge @miragon/bpmn-modeler-core @miragon/bpmn-modeler-shared
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn workspace @miragon/bpmn-modeler-bridge test
      # Post the coverage table as a sticky PR comment, but only when the
      # bridge's own files changed — a core/shared-only PR still runs these
      # tests yet should not surface a bridge coverage comment.
      - name: Report coverage on the PR
        if: >-
          always() && github.event_name == 'pull_request' &&
          needs.detect-changes.outputs.modeler-bridge-src == 'true'
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@v2.12.1
        with:
          working-directory: apps/modeler-bridge
          json-summary-path: ../../coverage/apps/modeler-bridge/coverage-summary.json
          json-final-path: ../../coverage/apps/modeler-bridge/coverage-final.json
          name: modeler-bridge
      - name: Upload coverage to Codecov
        if: needs.detect-changes.outputs.modeler-bridge-src == 'true'
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: "./coverage/apps/modeler-bridge"
          fail_ci_if_error: false
          flags: modeler-bridge
          name: modeler-bridge
          verbose: true

  test-intellij-plugin:
    needs: detect-changes
    # The IntelliJ plugin is a standalone Gradle/Kotlin build whose unit tests are
    # pure-JVM and depend only on its own sources (it bundles the pre-built bridge
    # and webviews at packaging time, not at test time), so trigger solely on its
    # own files — unlike the VS Code plugin it shares no TS deps with core/shared.
    if: needs.detect-changes.outputs.intellij-plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Setup JDK 21
        uses: actions/setup-java@v5.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
      # `jacocoTestReport` depends on `test`, so this runs the JUnit 5 suite and
      # then writes the coverage XML. Resources (bridge binary, webview bundles)
      # are absent on a clean checkout, so their Copy tasks are NO-SOURCE and the
      # pure-JVM tests run without the JS/Bun toolchain.
      - name: Run unit tests with coverage
        working-directory: apps/intellij-plugin
        run: ./gradlew jacocoTestReport --no-daemon
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/intellij-plugin/build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false
          flags: intellij-plugin
          name: intellij-plugin
          verbose: true

  # Extension-Host smoke test: the only job that runs the composition root
  # (`activate()` + custom-editor registration) end-to-end in a real VS Code.
  # Kept separate from lint/unit so their fast feedback is never delayed by
  # the heavy Electron launch.
  e2e-vscode-plugin:
    needs: detect-changes
    # Gate PRs (catch a dead extension before it lands) and back-stop pushes to
    # `main` only — the workflow's unfiltered `push:` trigger would otherwise run
    # this heavy job a second time on every PR branch. Path-filtered to anything
    # that can change the bundle or activation.
    if: >-
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') &&
      (needs.detect-changes.outputs.vscode-plugin == 'true' ||
       needs.detect-changes.outputs.modeler-core == 'true' ||
       needs.detect-changes.outputs.bpmn-webview == 'true' ||
       needs.detect-changes.outputs.dmn-webview == 'true' ||
       needs.detect-changes.outputs.deployment-webview == 'true' ||
       needs.detect-changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: Miragon/pin-npm-dependencies@v1.2.1
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install xvfb and Linux build deps for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies
        run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The test points at dist/apps/vscode-plugin, which only exists after a
      # full build (libs → webviews + plugin); `main: "main.js"` won't resolve
      # against the source tree.
      - name: Build the extension
        run: corepack yarn build
      # Cache the downloaded VS Code/Electron so reruns skip the ~150 MB fetch.
      - name: Cache VS Code download
        uses: actions/cache@v5.0.5
        with:
          path: apps/vscode-plugin/.vscode-test
          key: vscode-test-${{ runner.os }}
      - name: Run Extension-Host smoke test
        run: xvfb-run -a corepack yarn workspace vs-code-bpmn-modeler test:e2e

  test-bpmn-webview:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.bpmn-webview == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      needs.detect-changes.outputs.bpmn-i18n == 'true' ||
      needs.detect-changes.outputs.append-menu == 'true' ||
      needs.detect-changes.outputs.element-template-chooser == 'true' ||
      needs.detect-changes.outputs.bpmn-clipboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler @miragon/bpmn-modeler-webview @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-i18n @miragon/bpmn-modeler-append-menu @miragon/bpmn-modeler-element-template-chooser @miragon/bpmn-modeler-clipboard
      - run: yarn workspace @miragon/bpmn-modeler-webview test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: "./coverage/apps/bpmn-webview"
          fail_ci_if_error: false
          flags: bpmn-webview
          name: bpmn-webview
          verbose: true

  test-bpmn-i18n:
    needs: detect-changes
    if: needs.detect-changes.outputs.bpmn-i18n == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler @miragon/bpmn-modeler-i18n
      - run: yarn workspace @miragon/bpmn-modeler-i18n test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: "./coverage/libs/bpmn-i18n"
          fail_ci_if_error: false
          flags: bpmn-i18n
          name: bpmn-i18n
          verbose: true

  build-bpmn-webview:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.bpmn-webview == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      needs.detect-changes.outputs.bpmn-i18n == 'true' ||
      needs.detect-changes.outputs.append-menu == 'true' ||
      needs.detect-changes.outputs.element-template-chooser == 'true' ||
      needs.detect-changes.outputs.bpmn-clipboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus @miragon/bpmn-modeler-webview @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-i18n @miragon/bpmn-modeler-append-menu @miragon/bpmn-modeler-element-template-chooser @miragon/bpmn-modeler-clipboard
      - run: yarn workspace @miragon/bpmn-modeler-webview build

  build-dmn-webview:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.dmn-webview == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus @miragon/dmn-modeler-webview @miragon/bpmn-modeler-shared
      - run: yarn workspace @miragon/dmn-modeler-webview build

  build-deployment-webview:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.deployment-webview == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus @miragon/bpmn-modeler-deployment-webview @miragon/bpmn-modeler-shared
      - run: yarn workspace @miragon/bpmn-modeler-deployment-webview build

  verify-docs:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: Miragon/pin-npm-dependencies@v1.2.1
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn
      - run: corepack yarn workspaces focus @miragon/bpmn-modeler-docs
      - run: corepack yarn docs:test
      - run: corepack yarn docs:build

  ci:
    if: always()
    needs:
      - lint
      - audit
      - build-shared
      - build-bpmn-i18n
      - build-element-template-chooser
      - build-append-menu
      - build-bpmn-clipboard
      - build-vscode-plugin
      - test-vscode-plugin
      - test-modeler-core
      - test-modeler-bridge
      - test-intellij-plugin
      - e2e-vscode-plugin
      - test-bpmn-webview
      - test-bpmn-i18n
      - build-bpmn-webview
      - build-dmn-webview
      - build-deployment-webview
      - verify-docs
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed or were skipped
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | jq -e '
            to_entries | all(
              .value.result == "success" or .value.result == "skipped"
            )
          '

name: Build

on:
  push:
  pull_request:
    types: [ opened, reopened, synchronize ]

permissions:
  contents: read

# Workflow-level so a superseded PR run is cancelled as a single unit: the `ci`
# rollup then resolves to `cancelled` (not `failure`), and branch protection only
# evaluates the latest SHA's run — no spurious gate failure. `main` pushes are
# never cancelled (the expression is false on `refs/heads/main`), so back-stop
# runs always complete. Also frees CI minutes by cancelling every superseded job,
# not just the e2e smoke test.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      bpmn-i18n: ${{ steps.filter.outputs.bpmn-i18n }}
      element-template-chooser: ${{ steps.filter.outputs.element-template-chooser }}
      append-menu: ${{ steps.filter.outputs.append-menu }}
      bpmn-clipboard: ${{ steps.filter.outputs.bpmn-clipboard }}
      modeler-plugin: ${{ steps.filter.outputs.modeler-plugin }}
      bpmn-webview: ${{ steps.filter.outputs.bpmn-webview }}
      dmn-webview: ${{ steps.filter.outputs.dmn-webview }}
      deployment-webview: ${{ steps.filter.outputs.deployment-webview }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              - 'libs/shared/**'
            bpmn-i18n:
              - 'libs/bpmn-i18n/**'
            element-template-chooser:
              - 'libs/element-template-chooser/**'
            append-menu:
              - 'libs/append-menu/**'
            bpmn-clipboard:
              - 'libs/bpmn-clipboard/**'
            modeler-plugin:
              - 'apps/modeler-plugin/**'
            bpmn-webview:
              - 'apps/bpmn-webview/**'
            dmn-webview:
              - 'apps/dmn-webview/**'
            deployment-webview:
              - 'apps/deployment-webview/**'
            docs:
              - 'docs/**'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Miragon/pin-npm-dependencies@v1
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - name: Install Linux build deps for Theia native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies
        run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn lint
      - run: yarn format:check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Miragon/pin-npm-dependencies@v1
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - name: Install Linux build deps for Theia native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies
        run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn npm audit --all --severity high

  build-shared:
    needs: detect-changes
    if: needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - run: yarn workspaces focus @miragon/bpmn-modeler-shared
      - run: yarn workspace @miragon/bpmn-modeler-shared build

  build-bpmn-i18n:
    needs: detect-changes
    if: needs.detect-changes.outputs.bpmn-i18n == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - run: yarn workspaces focus @miragon/bpmn-modeler-i18n
      - run: yarn workspace @miragon/bpmn-modeler-i18n build

  build-element-template-chooser:
    needs: detect-changes
    if: needs.detect-changes.outputs.element-template-chooser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - run: yarn workspaces focus @miragon/bpmn-modeler-element-template-chooser
      - run: yarn workspace @miragon/bpmn-modeler-element-template-chooser build

  build-append-menu:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.append-menu == 'true' ||
      needs.detect-changes.outputs.element-template-chooser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - run: yarn workspaces focus @miragon/bpmn-modeler-append-menu
      - run: yarn workspace @miragon/bpmn-modeler-append-menu build

  build-bpmn-clipboard:
    needs: detect-changes
    if: needs.detect-changes.outputs.bpmn-clipboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - run: yarn workspaces focus @miragon/bpmn-modeler-clipboard
      - run: yarn workspace @miragon/bpmn-modeler-clipboard build

  build-modeler-plugin:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.modeler-plugin == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      needs.detect-changes.outputs.bpmn-i18n == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - name: Install Linux build deps for Theia native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies (focused)
        run: yarn workspaces focus vs-code-bpmn-modeler @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-i18n
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn workspace vs-code-bpmn-modeler build

  test-modeler-plugin:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.modeler-plugin == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      needs.detect-changes.outputs.bpmn-i18n == 'true'
    runs-on: ubuntu-latest
    # `pull-requests: write` lets the coverage-report step post/update its
    # sticky PR comment; job-level scope keeps the broader workflow read-only.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - name: Install Linux build deps for Theia native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler vs-code-bpmn-modeler @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-i18n
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn workspace vs-code-bpmn-modeler test
      # Post the coverage table as a sticky PR comment. `if: always()` so it
      # still reports when the per-layer thresholds fail the test step above —
      # that is exactly when you want to see which layer dropped.
      # `continue-on-error` so a read-only token on fork PRs can't fail CI.
      - name: Report coverage on the PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          # Paths resolve relative to working-directory; vitest writes the
          # reports to the repo-root coverage/ dir, two levels up.
          working-directory: apps/modeler-plugin
          json-summary-path: ../../coverage/apps/modeler-plugin/coverage-summary.json
          json-final-path: ../../coverage/apps/modeler-plugin/coverage-final.json
          name: modeler-plugin
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: "./coverage/apps/modeler-plugin"
          fail_ci_if_error: false
          flags: modeler-plugin
          name: modeler-plugin
          verbose: true

  # Extension-Host smoke test: the only job that runs the composition root
  # (`activate()` + custom-editor registration) end-to-end in a real VS Code.
  # Kept separate from lint/unit so their fast feedback is never delayed by
  # the heavy Electron launch.
  e2e-modeler-plugin:
    needs: detect-changes
    # Gate PRs (catch a dead extension before it lands) and back-stop pushes to
    # `main` only — the workflow's unfiltered `push:` trigger would otherwise run
    # this heavy job a second time on every PR branch. Path-filtered to anything
    # that can change the bundle or activation.
    if: >-
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') &&
      (needs.detect-changes.outputs.modeler-plugin == 'true' ||
       needs.detect-changes.outputs.bpmn-webview == 'true' ||
       needs.detect-changes.outputs.dmn-webview == 'true' ||
       needs.detect-changes.outputs.deployment-webview == 'true' ||
       needs.detect-changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Miragon/pin-npm-dependencies@v1
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - name: Install xvfb and Linux build deps for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies
        run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The test points at dist/apps/modeler-plugin, which only exists after a
      # full build (libs → webviews + plugin); `main: "main.js"` won't resolve
      # against the source tree.
      - name: Build the extension
        run: corepack yarn build
      # Cache the downloaded VS Code/Electron so reruns skip the ~150 MB fetch.
      - name: Cache VS Code download
        uses: actions/cache@v5
        with:
          path: apps/modeler-plugin/.vscode-test
          key: vscode-test-${{ runner.os }}
      - name: Run Extension-Host smoke test
        run: xvfb-run -a corepack yarn workspace vs-code-bpmn-modeler test:e2e

  test-bpmn-webview:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.bpmn-webview == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      needs.detect-changes.outputs.bpmn-i18n == 'true' ||
      needs.detect-changes.outputs.append-menu == 'true' ||
      needs.detect-changes.outputs.element-template-chooser == 'true' ||
      needs.detect-changes.outputs.bpmn-clipboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler @miragon/bpmn-modeler-webview @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-i18n @miragon/bpmn-modeler-append-menu @miragon/bpmn-modeler-element-template-chooser @miragon/bpmn-modeler-clipboard
      - run: yarn workspace @miragon/bpmn-modeler-webview test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: "./coverage/apps/bpmn-webview"
          fail_ci_if_error: false
          flags: bpmn-webview
          name: bpmn-webview
          verbose: true

  test-bpmn-i18n:
    needs: detect-changes
    if: needs.detect-changes.outputs.bpmn-i18n == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler @miragon/bpmn-modeler-i18n
      - run: yarn workspace @miragon/bpmn-modeler-i18n test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: "./coverage/libs/bpmn-i18n"
          fail_ci_if_error: false
          flags: bpmn-i18n
          name: bpmn-i18n
          verbose: true

  build-bpmn-webview:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.bpmn-webview == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      needs.detect-changes.outputs.bpmn-i18n == 'true' ||
      needs.detect-changes.outputs.append-menu == 'true' ||
      needs.detect-changes.outputs.element-template-chooser == 'true' ||
      needs.detect-changes.outputs.bpmn-clipboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus @miragon/bpmn-modeler-webview @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-i18n @miragon/bpmn-modeler-append-menu @miragon/bpmn-modeler-element-template-chooser @miragon/bpmn-modeler-clipboard
      - run: yarn workspace @miragon/bpmn-modeler-webview build

  build-dmn-webview:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.dmn-webview == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus @miragon/dmn-modeler-webview @miragon/bpmn-modeler-shared
      - run: yarn workspace @miragon/dmn-modeler-webview build

  build-deployment-webview:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.deployment-webview == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus @miragon/bpmn-modeler-deployment-webview @miragon/bpmn-modeler-shared
      - run: yarn workspace @miragon/bpmn-modeler-deployment-webview build

  verify-docs:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Miragon/pin-npm-dependencies@v1
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - run: corepack yarn workspaces focus @miragon/bpmn-modeler-docs
      - run: corepack yarn docs:test
      - run: corepack yarn docs:build

  ci:
    if: always()
    needs:
      - lint
      - audit
      - build-shared
      - build-bpmn-i18n
      - build-element-template-chooser
      - build-append-menu
      - build-bpmn-clipboard
      - build-modeler-plugin
      - test-modeler-plugin
      - e2e-modeler-plugin
      - test-bpmn-webview
      - test-bpmn-i18n
      - build-bpmn-webview
      - build-dmn-webview
      - build-deployment-webview
      - verify-docs
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed or were skipped
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | jq -e '
            to_entries | all(
              .value.result == "success" or .value.result == "skipped"
            )
          '

name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, reopened, synchronize ]
  # Runs every Vitest target with coverage, e.g. to refresh Codecov's carried-forward flags.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      intellij-plugin: ${{ steps.filter.outputs.intellij-plugin }}
      intellij-plugin-src: ${{ steps.filter.outputs.intellij-plugin-src }}
      standalone: ${{ steps.filter.outputs.standalone }}
      dep-alignment: ${{ steps.filter.outputs.dep-alignment }}
      docs: ${{ steps.filter.outputs.docs }}
      affected-targets: ${{ steps.targets.outputs.changes }}
      test-matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            intellij-plugin:
              - 'apps/intellij-plugin/**'
              # ProtocolHandlerCoverageTest checks the Kotlin handlers against it.
              - 'apps/modeler-bridge/src/protocol/protocol.json'
              # ModelerSettingsStoreTest runs the core's settings rows and checks
              # the Kotlin defaults against the VS Code manifest, ModelerLocalesTest
              # the Kotlin languages.
              - 'libs/modeler-core/src/kernel/domain/settingsNormalization.cases.json'
              - 'apps/vscode-plugin/package.json'
              # StatusSlotPlacementTest checks every status slot and view value has a Kotlin home.
              - 'libs/modeler-core/src/kernel/domain/statusView.ts'
            intellij-plugin-src:
              - 'apps/intellij-plugin/src/**'
            standalone:
              - 'apps/standalone/**'
              - 'libs/standalone-extension/**'
              - 'package.json'
              - 'yarn.lock'
            # Version-skew guard runs on any manifest or lockfile change that
            # could drift a shared dependency between the published packages and
            # their in-repo consumers.
            dep-alignment:
              - 'packages/bpmn-modeler/package.json'
              - 'packages/dmn-modeler/package.json'
              - 'apps/*/package.json'
              - 'libs/*/package.json'
              - 'tools/*/package.json'
              - 'package.json'
              - 'yarn.config.cjs'
              - 'yarn.lock'
            docs:
              - 'docs/**'
      # Each Vitest target in .github/vitest-targets.json becomes two filters:
      # `<id>` (its trigger paths plus the shared `global` ones) runs the target,
      # `<id>-src` (its own code files) additionally reports coverage, so the
      # release-please PR (CHANGELOG.md, package.json, gradle.properties) gets none.
      - id: target-filters
        run: |
          set -euo pipefail
          filters=$(jq -c '.global as $global | .targets | to_entries
            | map({(.key): (.value.paths + $global),
                   (.key + "-src"): [.value.dir + "/**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"]})
            | add' .github/vitest-targets.json)
          echo "filters=$filters" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: targets
        with:
          filters: ${{ steps.target-filters.outputs.filters }}
      - id: matrix
        env:
          CHANGES: ${{ steps.targets.outputs.changes }}
          RUN_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          matrix=$(jq -c --argjson changes "$CHANGES" --arg runAll "$RUN_ALL" '
            def changed($name): $runAll == "true" or ($changes | index($name)) != null;
            [.targets | to_entries[] | select(changed(.key)) | {
              id: .key,
              dir: .value.dir,
              package: .value.package,
              focus: ([.value.package] + (.value.focus // []) | join(" ")),
              typecheck: (.value.typecheck // ""),
              browser: (.value.browser // false),
              nativeBuildDeps: (.value.nativeBuildDeps // false),
              report: changed(.key + "-src")
            }]' .github/vitest-targets.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Miragon/pin-npm-dependencies@3f7f02fa2454cdd2cdb65df19b081c0d77d301a5 # v1.2.2
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install Linux build deps for Theia native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies
        run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn lint
      - run: yarn format:check
      - name: Unused files/deps/exports (knip)
        run: yarn knip
      - name: Every Vitest workspace is a CI test target
        run: node .github/scripts/check-vitest-targets.mjs

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Miragon/pin-npm-dependencies@3f7f02fa2454cdd2cdb65df19b081c0d77d301a5 # v1.2.2
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install Linux build deps for Theia native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies
        run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # npm's bulk-advisory endpoint intermittently takes far longer than yarn's
      # default 60s httpTimeout (observed 50-180s+), so allow 300s and retry.
      - name: Audit
        run: |
          for attempt in 1 2 3; do
            if yarn npm audit --all --severity high && yarn npm audit --all --recursive --severity critical; then exit 0; fi
            echo "audit attempt ${attempt} failed (advisory found or request timed out)"
          done
          exit 1
        env:
          YARN_HTTP_TIMEOUT: "300000"

  test:
    name: test (${{ matrix.id }})
    needs: detect-changes
    if: needs.detect-changes.outputs.test-matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.test-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspaces
        with:
          focus: ${{ matrix.focus }}
          native-build-deps: ${{ matrix.nativeBuildDeps }}
      - name: Install Playwright Chromium (browser-mode tests)
        if: matrix.browser
        env:
          PACKAGE: ${{ matrix.package }}
        run: yarn workspace "$PACKAGE" exec playwright install chromium --with-deps
      - name: Test with coverage
        env:
          PACKAGE: ${{ matrix.package }}
        run: yarn workspace "$PACKAGE" test
      - name: Typecheck
        if: matrix.typecheck != ''
        env:
          PACKAGE: ${{ matrix.package }}
          SCRIPT: ${{ matrix.typecheck }}
        run: yarn workspace "$PACKAGE" run "$SCRIPT"
      - name: Report coverage on the PR
        if: always() && github.event_name == 'pull_request' && matrix.report
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          working-directory: ${{ matrix.dir }}
          json-summary-path: ${{ github.workspace }}/coverage/${{ matrix.dir }}/coverage-summary.json
          json-final-path: ${{ github.workspace }}/coverage/${{ matrix.dir }}/coverage-final.json
          name: ${{ matrix.id }}
      - name: Upload coverage to Codecov
        if: matrix.report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/${{ matrix.dir }}/lcov.info
          disable_search: true
          fail_ci_if_error: false
          flags: ${{ matrix.id }}
          name: ${{ matrix.id }}
          verbose: true

  test-standalone:
    needs: detect-changes
    if: needs.detect-changes.outputs.standalone == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspaces
        with:
          focus: "bpmn-modeler @miragon/bpmn-modeler-standalone @miragon/bpmn-modeler-standalone-extension"
          native-build-deps: 'true'
      - run: yarn workspace @miragon/bpmn-modeler-standalone test:runtime
      - run: yarn workspace @miragon/bpmn-modeler-standalone test:security
      - run: yarn workspace @miragon/bpmn-modeler-standalone build
      - name: Verify secondary-window bundle
        run: test -f apps/standalone/lib/frontend/secondary-window.html

  test-intellij-plugin:
    needs: detect-changes
    if: needs.detect-changes.outputs.intellij-plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run unit tests with coverage
        working-directory: apps/intellij-plugin
        run: ./gradlew jacocoTestReport --no-daemon
      - name: Upload coverage to Codecov
        if: needs.detect-changes.outputs.intellij-plugin-src == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/intellij-plugin/build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false
          flags: intellij-plugin
          name: intellij-plugin
          verbose: true
      - name: Enforce coverage floor
        working-directory: apps/intellij-plugin
        run: ./gradlew jacocoTestCoverageVerification --no-daemon
      - name: Verify plugin binary compatibility
        working-directory: apps/intellij-plugin
        run: ./gradlew verifyPlugin --no-daemon

  e2e-vscode-plugin:
    needs: detect-changes
    if: >-
      contains(fromJSON(needs.detect-changes.outputs.affected-targets), 'vscode-plugin') ||
      contains(fromJSON(needs.detect-changes.outputs.affected-targets), 'modeler-core') ||
      contains(fromJSON(needs.detect-changes.outputs.affected-targets), 'shared') ||
      contains(fromJSON(needs.detect-changes.outputs.affected-targets), 'model-navigation') ||
      contains(fromJSON(needs.detect-changes.outputs.affected-targets), 'bpmn-modeler') ||
      contains(fromJSON(needs.detect-changes.outputs.affected-targets), 'dmn-modeler') ||
      contains(fromJSON(needs.detect-changes.outputs.affected-targets), 'bpmn-webview') ||
      contains(fromJSON(needs.detect-changes.outputs.affected-targets), 'dmn-webview') ||
      contains(fromJSON(needs.detect-changes.outputs.affected-targets), 'form-webview') ||
      contains(fromJSON(needs.detect-changes.outputs.affected-targets), 'deployment-webview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Miragon/pin-npm-dependencies@3f7f02fa2454cdd2cdb65df19b081c0d77d301a5 # v1.2.2
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install xvfb and Linux build deps for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies
        run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the extension
        run: corepack yarn build
      - name: Cache VS Code download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/vscode-plugin/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/vscode-plugin/test/e2e/.vscode-test.mjs', 'yarn.lock') }}-${{ github.run_id }}
          restore-keys: |
            vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/vscode-plugin/test/e2e/.vscode-test.mjs', 'yarn.lock') }}-
            vscode-test-${{ runner.os }}-${{ runner.arch }}-
      - name: Download VS Code test versions
        working-directory: apps/vscode-plugin
        run: |
          for attempt in 1 2 3; do
            echo "VS Code provisioning attempt ${attempt}/3"
            if corepack yarn node --input-type=module -e '
              import { downloadAndUnzipVSCode } from "@vscode/test-electron";
              for (const version of ["1.76.0", "stable"]) {
                await downloadAndUnzipVSCode({ version, timeout: 60_000 });
              }
            '; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          exit 1
      - name: Run Extension-Host smoke test
        run: xvfb-run -a corepack yarn workspace vs-code-bpmn-modeler test:e2e

  build-vscode-plugin:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.affected-targets), 'vscode-plugin')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspaces
        with:
          focus: "vs-code-bpmn-modeler @miragon/bpmn-modeler-core @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-types @miragon/bpmn-modeler-i18n-extras"
          native-build-deps: 'true'
      - run: yarn workspace vs-code-bpmn-modeler build

  build-bpmn-modeler:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.affected-targets), 'bpmn-modeler')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspaces
        with:
          focus: "@miragon/bpmn-modeler"
      # Full package build: tsc typecheck + Vite lib + theme CSS + the
      # check-dts gate (no private protocol symbols in the published d.ts).
      - run: yarn workspace @miragon/bpmn-modeler build
      - name: Verify published dist artefacts
        run: |
          test -f packages/bpmn-modeler/dist/index.js
          test -f packages/bpmn-modeler/dist/index.d.ts
          test -f packages/bpmn-modeler/dist/lint.js
          test -f packages/bpmn-modeler/dist/lint.d.ts
          test -f packages/bpmn-modeler/dist/viewer.js
          test -f packages/bpmn-modeler/dist/viewer.d.ts
          test -f packages/bpmn-modeler/dist/viewer.css
          test -f packages/bpmn-modeler/dist/design.js
          test -f packages/bpmn-modeler/dist/design.d.ts
          test -f packages/bpmn-modeler/dist/design.css
          test -f packages/bpmn-modeler/dist/mode.js
          test -f packages/bpmn-modeler/dist/mode.d.ts
          test -f packages/bpmn-modeler/dist/mode.css
          test -f packages/bpmn-modeler/dist/bpmn-modeler.css
          test -f packages/bpmn-modeler/dist/lightTheme.css
          test -f packages/bpmn-modeler/dist/darkTheme.css
      - name: Pack tarball
        run: yarn workspace @miragon/bpmn-modeler pack --out "$RUNNER_TEMP/miragon-bpmn-modeler.tgz"
      - name: Test hoisted and nested packed consumers
        run: node packages/bpmn-modeler/scripts/smoke-packed-consumer.mjs "$RUNNER_TEMP/miragon-bpmn-modeler.tgz"

  build-dmn-modeler:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.affected-targets), 'dmn-modeler')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspaces
        with:
          focus: "@miragon/dmn-modeler"
      # Full package build: tsc typecheck + public-api typecheck + Vite lib +
      # theme CSS + check-dts + check-externals gates.
      - run: yarn workspace @miragon/dmn-modeler build
      - name: Verify published dist artefacts
        run: |
          test -f packages/dmn-modeler/dist/index.js
          test -f packages/dmn-modeler/dist/index.d.ts
          test -f packages/dmn-modeler/dist/dmn-modeler.css
          test -f packages/dmn-modeler/dist/lightTheme.css
          test -f packages/dmn-modeler/dist/darkTheme.css

  build-bpmn-webview:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.affected-targets), 'bpmn-webview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspaces
        with:
          focus: "@miragon/bpmn-modeler @miragon/bpmn-modeler-webview @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-types @miragon/bpmn-modeler-i18n-extras @miragon/bpmn-modeler-append-menu @miragon/bpmn-modeler-element-template-chooser @miragon/bpmn-modeler-clipboard"
      - run: yarn workspace @miragon/bpmn-modeler-webview build

  build-dmn-webview:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.affected-targets), 'dmn-webview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspaces
        with:
          focus: "@miragon/dmn-modeler-webview @miragon/dmn-modeler @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-types @miragon/bpmn-modeler-i18n-extras"
      - run: yarn workspace @miragon/dmn-modeler-webview build

  build-form-webview:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.affected-targets), 'form-webview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspaces
        with:
          focus: "@miragon/form-modeler-webview @miragon/bpmn-modeler-shared"
      - run: yarn workspace @miragon/form-modeler-webview build

  build-deployment-webview:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.affected-targets), 'deployment-webview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspaces
        with:
          focus: "@miragon/bpmn-modeler-deployment-webview @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-types"
      - run: yarn workspace @miragon/bpmn-modeler-deployment-webview build

  check-dep-alignment:
    needs: detect-changes
    if: needs.detect-changes.outputs.dep-alignment == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Constraints and dedupe read manifests + yarn.lock only — no yarn install needed.
      - run: yarn constraints
      - run: yarn dedupe --check

  verify-docs:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Miragon/pin-npm-dependencies@3f7f02fa2454cdd2cdb65df19b081c0d77d301a5 # v1.2.2
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: yarn
      - run: corepack yarn workspaces focus @miragon/bpmn-modeler-docs
      - run: corepack yarn docs:test
      - run: corepack yarn docs:build

  ci:
    if: always()
    needs:
      - detect-changes
      - lint
      - audit
      - test
      - test-standalone
      - test-intellij-plugin
      - e2e-vscode-plugin
      - build-vscode-plugin
      - build-bpmn-modeler
      - build-dmn-modeler
      - build-bpmn-webview
      - build-dmn-webview
      - build-form-webview
      - build-deployment-webview
      - check-dep-alignment
      - verify-docs
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed or were skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e '
            to_entries | all(
              .value.result == "success" or .value.result == "skipped"
            )
          '

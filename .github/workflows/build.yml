name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, reopened, synchronize ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      bpmn-i18n-extras: ${{ steps.filter.outputs.bpmn-i18n-extras }}
      element-template-chooser: ${{ steps.filter.outputs.element-template-chooser }}
      append-menu: ${{ steps.filter.outputs.append-menu }}
      bpmn-clipboard: ${{ steps.filter.outputs.bpmn-clipboard }}
      model-navigation: ${{ steps.filter.outputs.model-navigation }}
      modeler-core: ${{ steps.filter.outputs.modeler-core }}
      modeler-bridge: ${{ steps.filter.outputs.modeler-bridge }}
      vscode-plugin: ${{ steps.filter.outputs.vscode-plugin }}
      vscode-plugin-src: ${{ steps.filter.outputs.vscode-plugin-src }}
      intellij-plugin: ${{ steps.filter.outputs.intellij-plugin }}
      intellij-plugin-src: ${{ steps.filter.outputs.intellij-plugin-src }}
      modeler-core-src: ${{ steps.filter.outputs.modeler-core-src }}
      modeler-bridge-src: ${{ steps.filter.outputs.modeler-bridge-src }}
      bpmn-modeler: ${{ steps.filter.outputs.bpmn-modeler }}
      bpmn-webview: ${{ steps.filter.outputs.bpmn-webview }}
      dmn-webview: ${{ steps.filter.outputs.dmn-webview }}
      form-webview: ${{ steps.filter.outputs.form-webview }}
      deployment-webview: ${{ steps.filter.outputs.deployment-webview }}
      standalone-extension: ${{ steps.filter.outputs.standalone-extension }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            shared:
              - 'libs/shared/**'
              - 'libs/modeler-types/**'
            # Covers the overlay and its pin of the shared @miragon/bpmn-modeler-i18n
            # npm package (this package.json). A lib bump lands as a version change
            # here, re-running the i18n coverage/overlay tests and every bundler that
            # ships it — so a key we depend on that upstream drops or renames turns
            # CI red instead of silently falling back to English.
            bpmn-i18n-extras:
              - 'libs/bpmn-i18n-extras/**'
            element-template-chooser:
              - 'libs/element-template-chooser/**'
            append-menu:
              - 'libs/append-menu/**'
            bpmn-clipboard:
              - 'libs/bpmn-clipboard/**'
            model-navigation:
              - 'libs/model-navigation/**'
            modeler-core:
              - 'libs/modeler-core/**'
            modeler-bridge:
              - 'apps/modeler-bridge/**'
            vscode-plugin:
              - 'apps/vscode-plugin/**'
            intellij-plugin:
              - 'apps/intellij-plugin/**'
            # `*-src` mirror the package filters above but drop the file
            # release-please bumps (package.json, or gradle.properties for the
            # IntelliJ plugin), so a version-bump-only PR skips the Codecov
            # coverage report while build+test still run via the broad filters.
            # Relies on `predicate-quantifier: every` to honour the negation.
            vscode-plugin-src:
              - 'apps/vscode-plugin/**'
              - '!apps/vscode-plugin/package.json'
            intellij-plugin-src:
              - 'apps/intellij-plugin/**'
              - '!apps/intellij-plugin/gradle.properties'
            modeler-core-src:
              - 'libs/modeler-core/**'
              - '!libs/modeler-core/package.json'
            modeler-bridge-src:
              - 'apps/modeler-bridge/**'
              - '!apps/modeler-bridge/package.json'
            bpmn-modeler:
              - 'packages/bpmn-modeler/**'
            bpmn-webview:
              - 'apps/bpmn-webview/**'
            dmn-webview:
              - 'apps/dmn-webview/**'
            form-webview:
              - 'apps/form-webview/**'
            deployment-webview:
              - 'apps/deployment-webview/**'
            standalone-extension:
              - 'apps/standalone/**'
              - 'libs/standalone-extension/**'
              - 'package.json'
              - 'yarn.lock'
            docs:
              - 'docs/**'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Miragon/pin-npm-dependencies@58fe24377aef66748a1444ff69ab05e3f938a798 # v1.2.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install Linux build deps for Theia native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies
        run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn lint
      - run: yarn format:check
      - name: Unused files/deps/exports (knip)
        run: yarn knip

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Miragon/pin-npm-dependencies@58fe24377aef66748a1444ff69ab05e3f938a798 # v1.2.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install Linux build deps for Theia native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies
        run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn npm audit --all --severity high

  test-standalone-extension:
    needs: detect-changes
    if: needs.detect-changes.outputs.standalone-extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install Linux build deps for Theia native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler @miragon/bpmn-modeler-standalone @miragon/bpmn-modeler-standalone-extension
      - run: yarn workspace @miragon/bpmn-modeler-standalone-extension test
      - run: yarn workspace @miragon/bpmn-modeler-standalone build
      - name: Verify secondary-window bundle
        run: test -f apps/standalone/lib/frontend/secondary-window.html

  build-shared:
    needs: detect-changes
    if: needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - run: yarn workspaces focus @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-types
      - run: yarn workspace @miragon/bpmn-modeler-types build
      - run: yarn workspace @miragon/bpmn-modeler-shared build

  build-bpmn-i18n-extras:
    needs: detect-changes
    if: needs.detect-changes.outputs.bpmn-i18n-extras == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - run: yarn workspaces focus @miragon/bpmn-modeler-i18n-extras
      - run: yarn workspace @miragon/bpmn-modeler-i18n-extras build

  build-element-template-chooser:
    needs: detect-changes
    if: needs.detect-changes.outputs.element-template-chooser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - run: yarn workspaces focus @miragon/bpmn-modeler-element-template-chooser
      - run: yarn workspace @miragon/bpmn-modeler-element-template-chooser build

  build-append-menu:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.append-menu == 'true' ||
      needs.detect-changes.outputs.element-template-chooser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - run: yarn workspaces focus @miragon/bpmn-modeler-append-menu
      - run: yarn workspace @miragon/bpmn-modeler-append-menu build

  build-bpmn-clipboard:
    needs: detect-changes
    if: needs.detect-changes.outputs.bpmn-clipboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - run: yarn workspaces focus @miragon/bpmn-modeler-clipboard
      - run: yarn workspace @miragon/bpmn-modeler-clipboard build

  build-vscode-plugin:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.vscode-plugin == 'true' ||
      needs.detect-changes.outputs.modeler-core == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      needs.detect-changes.outputs.bpmn-i18n-extras == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install Linux build deps for Theia native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies (focused)
        run: yarn workspaces focus vs-code-bpmn-modeler @miragon/bpmn-modeler-core @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-types @miragon/bpmn-modeler-i18n-extras
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn workspace vs-code-bpmn-modeler build

  test-vscode-plugin:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.vscode-plugin == 'true' ||
      needs.detect-changes.outputs.modeler-core == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      needs.detect-changes.outputs.bpmn-i18n-extras == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install Linux build deps for Theia native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler vs-code-bpmn-modeler @miragon/bpmn-modeler-core @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-types @miragon/bpmn-modeler-i18n-extras
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn workspace vs-code-bpmn-modeler test
      - name: Report coverage on the PR
        if: >-
          always() && github.event_name == 'pull_request' &&
          needs.detect-changes.outputs.vscode-plugin-src == 'true'
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          working-directory: apps/vscode-plugin
          json-summary-path: ../../coverage/apps/vscode-plugin/coverage-summary.json
          json-final-path: ../../coverage/apps/vscode-plugin/coverage-final.json
          name: vscode-plugin
      - name: Upload coverage to Codecov
        if: needs.detect-changes.outputs.vscode-plugin-src == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: "./coverage/apps/vscode-plugin"
          fail_ci_if_error: false
          flags: vscode-plugin
          name: vscode-plugin
          verbose: true

  test-modeler-core:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.modeler-core == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler @miragon/bpmn-modeler-core @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-types
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn workspace @miragon/bpmn-modeler-core test
      - name: Report coverage on the PR
        if: >-
          always() && github.event_name == 'pull_request' &&
          needs.detect-changes.outputs.modeler-core-src == 'true'
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          working-directory: libs/modeler-core
          json-summary-path: ../../coverage/libs/modeler-core/coverage-summary.json
          json-final-path: ../../coverage/libs/modeler-core/coverage-final.json
          name: modeler-core
      - name: Upload coverage to Codecov
        if: needs.detect-changes.outputs.modeler-core-src == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: "./coverage/libs/modeler-core"
          fail_ci_if_error: false
          flags: modeler-core
          name: modeler-core
          verbose: true

  test-modeler-bridge:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.modeler-bridge == 'true' ||
      needs.detect-changes.outputs.modeler-core == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler @miragon/bpmn-modeler-bridge @miragon/bpmn-modeler-core @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-types
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn workspace @miragon/bpmn-modeler-bridge test
      - name: Report coverage on the PR
        if: >-
          always() && github.event_name == 'pull_request' &&
          needs.detect-changes.outputs.modeler-bridge-src == 'true'
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          working-directory: apps/modeler-bridge
          json-summary-path: ../../coverage/apps/modeler-bridge/coverage-summary.json
          json-final-path: ../../coverage/apps/modeler-bridge/coverage-final.json
          name: modeler-bridge
      - name: Upload coverage to Codecov
        if: needs.detect-changes.outputs.modeler-bridge-src == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: "./coverage/apps/modeler-bridge"
          fail_ci_if_error: false
          flags: modeler-bridge
          name: modeler-bridge
          verbose: true

  test-intellij-plugin:
    needs: detect-changes
    if: needs.detect-changes.outputs.intellij-plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run unit tests with coverage
        working-directory: apps/intellij-plugin
        run: ./gradlew jacocoTestReport --no-daemon
      - name: Upload coverage to Codecov
        if: needs.detect-changes.outputs.intellij-plugin-src == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/intellij-plugin/build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false
          flags: intellij-plugin
          name: intellij-plugin
          verbose: true
      - name: Verify plugin binary compatibility
        working-directory: apps/intellij-plugin
        run: ./gradlew verifyPlugin --no-daemon

  e2e-vscode-plugin:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.vscode-plugin == 'true' ||
      needs.detect-changes.outputs.modeler-core == 'true' ||
      needs.detect-changes.outputs.bpmn-modeler == 'true' ||
      needs.detect-changes.outputs.bpmn-webview == 'true' ||
      needs.detect-changes.outputs.dmn-webview == 'true' ||
      needs.detect-changes.outputs.form-webview == 'true' ||
      needs.detect-changes.outputs.deployment-webview == 'true' ||
      needs.detect-changes.outputs.model-navigation == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Miragon/pin-npm-dependencies@58fe24377aef66748a1444ff69ab05e3f938a798 # v1.2.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install xvfb and Linux build deps for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies
        run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the extension
        run: corepack yarn build
      - name: Cache VS Code download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/vscode-plugin/.vscode-test
          key: vscode-test-${{ runner.os }}
      - name: Run Extension-Host smoke test
        run: xvfb-run -a corepack yarn workspace vs-code-bpmn-modeler test:e2e

  test-bpmn-webview:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.bpmn-webview == 'true' ||
      needs.detect-changes.outputs.bpmn-modeler == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      needs.detect-changes.outputs.bpmn-i18n-extras == 'true' ||
      needs.detect-changes.outputs.append-menu == 'true' ||
      needs.detect-changes.outputs.element-template-chooser == 'true' ||
      needs.detect-changes.outputs.bpmn-clipboard == 'true' ||
      needs.detect-changes.outputs.model-navigation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler @miragon/bpmn-modeler @miragon/bpmn-modeler-webview @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-types @miragon/bpmn-modeler-i18n-extras @miragon/bpmn-modeler-append-menu @miragon/bpmn-modeler-element-template-chooser @miragon/bpmn-modeler-clipboard
      - run: yarn workspace @miragon/bpmn-modeler-webview test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: "./coverage/apps/bpmn-webview"
          fail_ci_if_error: false
          flags: bpmn-webview
          name: bpmn-webview
          verbose: true

  test-form-webview:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.form-webview == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler @miragon/form-modeler-webview @miragon/bpmn-modeler-shared
      - run: yarn workspace @miragon/form-modeler-webview test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: "./coverage/apps/form-webview"
          fail_ci_if_error: false
          flags: form-webview
          name: form-webview
          verbose: true

  test-model-navigation:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.model-navigation == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus @miragon/bpmn-model-navigation @miragon/bpmn-modeler-shared
      - run: yarn workspace @miragon/bpmn-model-navigation test
      - run: yarn workspace @miragon/bpmn-model-navigation build

  test-bpmn-i18n-extras:
    needs: detect-changes
    if: needs.detect-changes.outputs.bpmn-i18n-extras == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus bpmn-modeler @miragon/bpmn-modeler-i18n-extras
      - run: yarn workspace @miragon/bpmn-modeler-i18n-extras test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: "./coverage/libs/bpmn-i18n-extras"
          fail_ci_if_error: false
          flags: bpmn-i18n-extras
          name: bpmn-i18n-extras
          verbose: true

  build-bpmn-webview:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.bpmn-webview == 'true' ||
      needs.detect-changes.outputs.bpmn-modeler == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      needs.detect-changes.outputs.bpmn-i18n-extras == 'true' ||
      needs.detect-changes.outputs.append-menu == 'true' ||
      needs.detect-changes.outputs.element-template-chooser == 'true' ||
      needs.detect-changes.outputs.bpmn-clipboard == 'true' ||
      needs.detect-changes.outputs.model-navigation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus @miragon/bpmn-modeler @miragon/bpmn-modeler-webview @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-types @miragon/bpmn-modeler-i18n-extras @miragon/bpmn-modeler-append-menu @miragon/bpmn-modeler-element-template-chooser @miragon/bpmn-modeler-clipboard
      - run: yarn workspace @miragon/bpmn-modeler-webview build

  test-bpmn-modeler:
    needs: detect-changes
    if: needs.detect-changes.outputs.bpmn-modeler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus @miragon/bpmn-modeler
      - run: yarn workspace @miragon/bpmn-modeler test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: "./coverage/packages/bpmn-modeler"
          fail_ci_if_error: false
          flags: bpmn-modeler
          name: bpmn-modeler
          verbose: true

  build-bpmn-modeler:
    needs: detect-changes
    if: needs.detect-changes.outputs.bpmn-modeler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus @miragon/bpmn-modeler
      # Full package build: tsc typecheck + Vite lib + theme CSS + the
      # check-dts gate (no private protocol symbols in the published d.ts).
      - run: yarn workspace @miragon/bpmn-modeler build
      - name: Verify published dist artefacts
        run: |
          test -f packages/bpmn-modeler/dist/index.js
          test -f packages/bpmn-modeler/dist/index.d.ts
          test -f packages/bpmn-modeler/dist/bpmn-modeler.css
          test -f packages/bpmn-modeler/dist/lightTheme.css
          test -f packages/bpmn-modeler/dist/darkTheme.css

  build-dmn-webview:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.dmn-webview == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      needs.detect-changes.outputs.bpmn-i18n-extras == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus @miragon/dmn-modeler-webview @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-types
      - run: yarn workspace @miragon/dmn-modeler-webview build

  build-form-webview:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.form-webview == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus @miragon/form-modeler-webview @miragon/bpmn-modeler-shared
      - run: yarn workspace @miragon/form-modeler-webview build

  build-deployment-webview:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.deployment-webview == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies (focused)
        run: yarn workspaces focus @miragon/bpmn-modeler-deployment-webview @miragon/bpmn-modeler-shared @miragon/bpmn-modeler-types
      - run: yarn workspace @miragon/bpmn-modeler-deployment-webview build

  verify-docs:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Miragon/pin-npm-dependencies@58fe24377aef66748a1444ff69ab05e3f938a798 # v1.2.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
      - run: corepack yarn workspaces focus @miragon/bpmn-modeler-docs
      - run: corepack yarn docs:test
      - run: corepack yarn docs:build

  ci:
    if: always()
    needs:
      - lint
      - audit
      - build-shared
      - build-bpmn-i18n-extras
      - build-element-template-chooser
      - build-append-menu
      - build-bpmn-clipboard
      - build-vscode-plugin
      - test-vscode-plugin
      - test-modeler-core
      - test-modeler-bridge
      - test-intellij-plugin
      - e2e-vscode-plugin
      - test-bpmn-webview
      - test-form-webview
      - test-model-navigation
      - test-bpmn-i18n-extras
      - test-standalone-extension
      - test-bpmn-modeler
      - build-bpmn-modeler
      - build-bpmn-webview
      - build-dmn-webview
      - build-form-webview
      - build-deployment-webview
      - verify-docs
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed or were skipped
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | jq -e '
            to_entries | all(
              .value.result == "success" or .value.result == "skipped"
            )
          '
